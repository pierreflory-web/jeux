<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#633806">
<title>Ma Ville</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Rye&display=swap" rel="stylesheet">
<style>
:root{--wood:#633806;--wood-d:#412402;--wood-l:#854F0B;--paper:#FAEEDA;--paper-2:#fff8ec;--paper-d:#FAC775;--ink:#412402;--ink-2:#633806;--red:#A32D2D;--green:#3B6D11;--sand:#BA7517}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1703;font-family:Nunito,system-ui,sans-serif;font-weight:600;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.west{font-family:Rye,Georgia,serif;font-weight:400}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
#hud{background:var(--wood);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));color:var(--paper);z-index:5;border-bottom:3px solid var(--wood-d)}
.hud-top{display:flex;gap:6px;align-items:stretch}
.board{flex:1;min-width:0;border:2px solid var(--wood-d);border-radius:8px;padding:5px 8px;background:repeating-linear-gradient(180deg,#854F0B 0 12px,#764508 12px 13px);display:flex;align-items:center;gap:8px}
.board .name{font-family:Rye,Georgia,serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 var(--wood-d)}
.nail{width:6px;height:6px;border-radius:50%;background:var(--wood-d);flex:none}
.lvl{max-width:132px;background:var(--paper);color:var(--ink);border:2px solid var(--wood-d);border-radius:12px;padding:3px 8px;min-width:100px;font-size:12px;line-height:1.2;text-align:left}
.lvl .bar{height:7px;background:var(--paper-d);border-radius:4px;overflow:hidden;margin-top:3px}
.lvl .bar i{display:block;height:100%;background:var(--green)}
.icon-btn{width:42px;border-radius:10px;border:2px solid var(--wood-d);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#resBar{display:flex;gap:4px;margin-top:7px}
.res{flex:1;display:flex;align-items:center;gap:3px;justify-content:center;background:var(--paper);color:var(--ink);border:1.5px solid var(--sand);border-radius:14px;padding:3px 2px;font-weight:800;font-size:14px;min-width:0}
.res svg{width:18px;height:18px;flex:none}
.res.flash{animation:flash .7s}
@keyframes flash{0%{background:#C0DD97;transform:scale(1.12)}100%{background:var(--paper);transform:scale(1)}}
.res.lose{animation:lose .7s}
@keyframes lose{0%{background:#F7C1C1;transform:scale(1.12)}100%{background:var(--paper)}}
#sceneWrap{flex:1;position:relative;min-height:0;background:#B5D4F4}
#scene{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#scene::-webkit-scrollbar{display:none}
#scene svg{height:100%;display:block}
#nav{display:flex;background:var(--wood);border-top:3px solid var(--wood-d);padding:6px 2px;padding-bottom:max(6px,env(safe-area-inset-bottom));background-image:repeating-linear-gradient(180deg,#633806 0 16px,#58320a 16px 17px)}
#nav button{flex:1;background:none;border:0;color:var(--paper);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;position:relative;min-height:58px}
#nav .ic{width:42px;height:42px;border-radius:50%;background:var(--paper);border:2px solid var(--wood-d);display:flex;align-items:center;justify-content:center}
#nav .ic svg{width:26px;height:26px}
#nav button.on .ic{background:var(--paper-d)}
.badge{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--wood);padding:0 4px}
.gus{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:flex-start;z-index:3;animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateY(-20px);opacity:0}}
.gus .face{flex:none;width:54px;height:54px}
.gus .bubble{flex:1;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:7px 34px 8px 11px;font-size:15px;line-height:1.35;position:relative;box-shadow:0 3px 0 rgba(65,36,2,.25)}
.gus .who{font-size:12px;color:var(--ink-2);font-weight:800}
.gus .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border:0;background:none;color:var(--ink-2);font-size:18px}
.banner{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:var(--green);color:#fff;border:2px solid #27500A;border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.banner span{flex:1}
.banner.red{background:var(--red);border-color:#791F1F}
.banner button{min-height:40px;border-radius:20px;border:2px solid #fff;background:transparent;color:#fff;font-weight:800;padding:0 12px}
.scrim{position:absolute;inset:0;background:rgba(30,15,0,.45);z-index:15}
.scrim.hidden{display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;background:var(--paper);border-top:3px solid var(--wood-d);border-radius:20px 20px 0 0;z-index:20;display:flex;flex-direction:column;transition:transform .25s ease-out}
.sheet.hidden{transform:translateY(105%);pointer-events:none}
.sheet-head{display:flex;align-items:center;padding:12px 14px 8px;gap:8px;border-bottom:1.5px dashed #E2C99B}
.sheet-head h2{flex:1;margin:0;font-family:Rye,Georgia,serif;font-size:20px;font-weight:400}
.close{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--paper-2);font-size:20px;color:var(--ink);flex:none}
.sheet-body{overflow-y:auto;padding:12px 14px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
h3{font-family:Rye,Georgia,serif;font-weight:400;font-size:17px;margin:16px 0 8px;color:var(--ink)}
h3:first-child{margin-top:0}
p{margin:6px 0;line-height:1.45}
.muted{color:#7a5a2e;font-size:14px}
.card{background:var(--paper-2);border:2px solid #E2C99B;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{min-height:46px;border-radius:23px;border:2px solid var(--ink);background:var(--paper-2);color:var(--ink);font-weight:800;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--wood-l);color:var(--paper);border-color:var(--wood-d)}
.btn.red{background:var(--red);color:#fff;border-color:#791F1F}
.btn.green{background:var(--green);color:#fff;border-color:#27500A}
.btn.small{min-height:38px;font-size:14px;padding:0 12px}
.btn.full{width:100%}
.btn.off{opacity:.55}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1}
.cost{display:inline-flex;gap:3px;align-items:center;font-weight:800;font-size:13px;padding:2px 7px;border-radius:10px;background:#EAF3DE;color:#27500A;margin:2px 3px 2px 0}
.cost.no{background:#FCEBEB;color:#791F1F}
.cost svg{width:15px;height:15px}
.pbar{height:12px;background:#E9D7B4;border-radius:6px;overflow:hidden;border:1.5px solid #C9A86E}
.pbar i{display:block;height:100%;background:var(--green);border-radius:6px}
.pbar.warn i{background:#BA7517}.pbar.bad i{background:var(--red)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{background:var(--paper-2);border:2px solid #E2C99B;border-radius:14px;padding:6px 8px 8px;text-align:left;color:var(--ink);position:relative;display:flex;flex-direction:column}
.bcard .th{height:92px;display:flex;justify-content:center}
.bcard .th svg{height:100%}
.bcard b{font-size:15px;display:block;margin:2px 0}
.bcard.locked{opacity:.6}
.bcard .tag{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;background:#F1EFE8;color:#5F5E5A;border-radius:8px;padding:2px 6px}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;background:#FAC775;color:#633806}
.modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(30,15,0,.62);padding:14px}
.modal.hidden{display:none}
.mcard{background:var(--paper);border:3px solid var(--wood-d);border-radius:18px;max-width:440px;width:100%;max-height:94%;overflow:auto;padding:16px;animation:popm .3s cubic-bezier(.3,1.4,.6,1)}
@keyframes popm{from{transform:scale(.85);opacity:0}}
.mcard h2{font-family:Rye,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 6px;text-align:center}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:var(--wood-d);color:var(--paper);border-radius:14px;padding:9px 14px;font-weight:800;font-size:15px;text-align:center;animation:tin .25s ease-out;pointer-events:auto;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.toast button{border:2px solid var(--paper);background:transparent;color:var(--paper);border-radius:14px;min-height:32px;padding:0 10px;font-weight:800}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;border-radius:20px;border:2px solid var(--sand);background:var(--paper-d);color:var(--ink-2);font-weight:800;padding:0 14px}
.tab.on{background:var(--wood-l);color:var(--paper);border-color:var(--wood-d)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border-radius:12px;border:2px solid #E2C99B;background:var(--paper-2);position:relative;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.opt svg{width:100%;aspect-ratio:120/110;border-radius:8px}
.opt.on{border:3px solid var(--wood-l);background:#FAEEDA}
.opt .lbl{font-size:12px;font-weight:800;line-height:1.1;margin-top:2px;text-align:center}
.opt .lock{position:absolute;top:4px;right:4px;background:#5F5E5A;color:#fff;border-radius:8px;font-size:10px;padding:1px 5px;font-weight:800}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--sand);position:relative}
.sw.on{outline:3px solid var(--wood-l);outline-offset:2px}
.sw .lock{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#5F5E5A;color:#fff;border-radius:8px;font-size:9px;padding:0 4px;font-weight:800;white-space:nowrap}
.field{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--sand);background:var(--paper-2);padding:0 12px;font-size:16px;color:var(--ink);font-weight:800}
.err{color:#A32D2D;font-size:13px;font-weight:800;margin-top:4px}
.posters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;border-radius:14px;background:repeating-linear-gradient(180deg,#854F0B 0 26px,#764508 26px 28px)}
.posters button{background:none;border:0;padding:0;position:relative}
.posters svg{width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.posters button:nth-child(3n+1) svg{transform:rotate(-2deg)}.posters button:nth-child(3n+2) svg{transform:rotate(1.5deg)}
.posters .hunt{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;font-size:10px;font-weight:800;padding:0 5px;white-space:nowrap}
.editor-prev{display:flex;justify-content:center;padding:6px 0 10px;background:repeating-linear-gradient(180deg,#854F0B 0 24px,#764508 24px 26px);border-radius:14px;margin-bottom:10px}
.editor-prev svg{width:58%;max-width:230px;transform:rotate(-1.5deg);filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.gz{background:#F7EEDC;border:3px double var(--ink);padding:12px 14px;font-family:Georgia,serif;color:#2C2C2A}
.gz .mast{font-family:Rye,Georgia,serif;font-size:26px;text-align:center;border-bottom:3px double #2C2C2A;padding-bottom:4px;line-height:1.1}
.gz .date{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #2C2C2A;padding:3px 0;margin-bottom:8px;font-style:italic}
.gz .item{padding:8px 0;border-bottom:1px dashed #888780;font-size:15px;line-height:1.4}
.gz .item b{font-family:Rye,Georgia,serif;font-weight:400;font-size:17px;display:block;margin-bottom:2px}
.raid{position:absolute;inset:0;z-index:50;background:#140f2a;display:flex;flex-direction:column;color:var(--paper)}
.raid-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.raid-top .west{font-size:20px}
.raid-time{font-family:Rye,Georgia,serif;font-size:30px;color:#FAC775}
.raid-field{flex:1;position:relative;overflow:hidden}
.raid-field>svg{position:absolute;inset:0;width:100%;height:100%}
.bandit{position:absolute;width:78px;height:92px;transform:translate(-50%,-100%);border:0;background:none;padding:0;animation:bpop .18s ease-out}
.bandit svg{width:100%;height:100%}
.bandit.run{animation:brun .35s ease-in forwards;pointer-events:none}
.bandit.hit{animation:bhit .3s ease-in forwards;pointer-events:none}
@keyframes bpop{from{transform:translate(-50%,-60%) scale(.3);opacity:0}}
@keyframes brun{to{transform:translate(140%,-100%);opacity:0}}
@keyframes bhit{to{transform:translate(-50%,-100%) scale(.2) rotate(40deg);opacity:0}}
.pan{position:absolute;transform:translate(-50%,-50%);font-family:Rye,Georgia,serif;font-size:26px;color:#FAC775;pointer-events:none;animation:panf .6s ease-out forwards;text-shadow:0 2px 0 #A32D2D}
@keyframes panf{to{transform:translate(-50%,-120%) scale(1.4);opacity:0}}
.raid-bottom{padding:12px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.raid-bar{height:22px;border-radius:11px;background:#3C3489;overflow:hidden;position:relative;border:2px solid #FAC775}
.raid-bar i{display:block;height:100%;background:#FAC775;transition:width .2s}
.raid-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#26215C}
.bob{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:popin .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.1);opacity:0}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.smoke{animation:smoke 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(8px,-36px) scale(1.6);opacity:0}}
.flick{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{opacity:.6}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.tap{cursor:pointer}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #E2C99B;font-size:15px}
.kv:last-child{border-bottom:0}
.neg{color:#3B6D11;font-weight:800}.pos{color:#A32D2D;font-weight:800}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.sim{font-size:12px;font-weight:800;background:#EEEDFE;color:#3C3489;border-radius:8px;padding:2px 8px;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-top">
      <a class="icon-btn" href="../" aria-label="Retour à Mes Jeux"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#412402" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="board" data-act="settings"><span class="nail"></span><span class="name" id="townName">Rocky Creek</span></div>
      <div class="lvl" id="lvl"></div>
      <button class="icon-btn" data-act="settings" aria-label="Réglages"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#412402" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
    <div id="resBar"></div>
  </header>
  <main id="sceneWrap">
    <div id="scene"></div>
    <div id="gusBox"></div>
    <div id="bannerBox"></div>
  </main>
  <nav id="nav"></nav>
  <div class="scrim hidden" id="scrim" data-act="closeSheet"></div>
  <section class="sheet hidden" id="sheet" aria-modal="true" role="dialog">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" data-act="closeSheet" aria-label="Fermer">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="modal hidden" id="modal"><div class="mcard" id="modalBody"></div></div>
  <div id="raidBox"></div>
  <div id="toast"></div>
</div>
<script src="../points.js"></script>
<script>
'use strict';
/* ================== Constantes ================== */
const KEY='maVilleWestern_v1', DAY=864e5, HOUR=36e5;
const LEVEL_NAMES=['','Campement','Hameau','Village','Ville','Capitale','Cité','Métropole','Grande Métropole','Légende de l’Ouest','Eldorado'];
const ART=['','un','un','un','une','une','une','une','une','une','un'];
const MAXL=10;
const PLOTS=[0,5,8,11,14,16,18,20,22,24,26];
const LEVEL_REQ=[null,null,{pop:10},{pop:30,need:'saloon'},{pop:60,need:'sherif'},{pop:130,need:'journal'},{pop:180,need:'opera'},{pop:240,need:'mairie'},{pop:310,need:'chateau'},{pop:390,need:'cirque'},{pop:480,need:'train'}];
const CAPS={p:90,b:40,pi:40,f:30,m:8};
const RES=['p','b','pi','f','m'];
const RES_NAME={p:'dollars',b:'bois',pi:'pierre',f:'foin',m:'magie'};
const K='#412402';

const BUILD={
  maison:{name:'Maison',cat:'Habitations',desc:'Loge des habitants. S’améliore sur place : tente, cabane, maison en bois, maison en pierre.',levels:[
    {n:'Tente',min:1,cost:{p:20},pop:2},{n:'Cabane',min:1,cost:{b:30},pop:5},{n:'Maison en bois',min:2,cost:{b:60,pi:20},pop:10},{n:'Maison en pierre',min:3,cost:{b:40,pi:80},pop:20},{n:'Manoir',min:6,cost:{p:150,b:100,pi:150},pop:35}]},
  hotel:{name:'Hôtel',cat:'Habitations',unique:1,desc:'Un grand hôtel de trois étages : +30 habitants.',levels:[{min:4,cost:{p:200,b:80,pi:60},pop:30}]},
  potager:{name:'Potager',cat:'Production',desc:'Des légumes vendus au marché.',levels:[{min:1,cost:{f:10},prod:{p:5}}]},
  saloon:{name:'Saloon',cat:'Production',unique:1,desc:'Les clients paient leur limonade. Obligatoire pour devenir un Village.',levels:[{min:2,cost:{p:80,b:40},prod:{p:15}},{min:2,cost:{p:120,b:60},prod:{p:25}},{min:3,cost:{p:200,b:80,pi:40},prod:{p:40}}]},
  scierie:{name:'Scierie',cat:'Production',desc:'Produit du bois chaque jour.',levels:[{min:2,cost:{p:40,pi:20},prod:{b:3}}]},
  carriere:{name:'Carrière',cat:'Production',desc:'Produit de la pierre chaque jour.',levels:[{min:3,cost:{b:60,p:20},prod:{pi:3}}]},
  grange:{name:'Grange',cat:'Production',desc:'Produit du foin chaque jour.',levels:[{min:3,cost:{b:50,f:20},prod:{f:3}}]},
  mine:{name:'Mine d’or',cat:'Production',unique:1,desc:'Beaucoup de dollars… mais elle attire les bandits (+10 % de risque).',levels:[{min:4,cost:{b:100,pi:100},prod:{p:40}}]},
  puits:{name:'Puits',cat:'Services',desc:'Son eau empêche la poussière sur les bâtiments voisins (gauche et droite).',levels:[{min:1,cost:{pi:15}}]},
  magasin:{name:'Magasin général',cat:'Services',unique:1,desc:'Échange 3 ressources contre 1 autre, quand tu veux.',levels:[{min:2,cost:{p:60,b:30}}]},
  ecurie:{name:'Écurie',cat:'Services',unique:1,desc:'Les chasses du shérif vont 25 % plus vite.',levels:[{min:2,cost:{b:50,f:20}}]},

  if(!ME&&!S.gusSeen.includes('login'))return {k:'login',t:'Connecte-toi sur <b>Mes Jeux</b> (bouton ← en haut) : ta ville sera sauvegardée et tes parties lui enverront des ressources.'};
  if(!built)return {k:'t0',t:`Bienvenue à <b>${esc(S.name)}</b> ! Je suis le vieux Gus, le maire. Touche un terrain <b>« À bâtir »</b> pour planter ta première tente.`};
  const anyReady=S.plots.some(p=>p&&ready(p)&&ready(p).n>=1);
  if(anyReady&&!S.collected)return {k:'t1',t:'Tes bâtiments ont produit ! Touche les <b>bulles</b> au-dessus pour récolter.'};
  if(built<3)return {k:'t2',t:'Il te faut des ressources ? Chaque partie gagnée dans les jeux du lanceur en envoie à ta ville : onglet <b>Jeux</b>.'};
  const dusty=S.plots.find(p=>p&&p.c<70);if(dusty)return {k:'dust'+t,t:`<b>${bName(dusty)}</b> est tout poussiéreux. Touche-le pour le réparer.`};

  const b=S.posters.find(p=>p.kind==='bandit'&&!p.captured&&!p.hunt);if(b)return {k:'b'+b.id,t:has('sherif')?`<b>${esc(b.name)}</b> court toujours avec ton butin. Lance une chasse depuis les <b>Affiches</b> !`:`<b>${esc(b.name)}</b> t’a volé. Construis le <b>bureau du shérif</b> (niveau 3) pour le pourchasser.`};
  const q=nextReq();if(q)return {k:'lv'+S.level,t:`Encore <b>${Math.max(0,q.pop-population(S))} habitants</b>${q.need&&!has(q.need)?` et un <b>${BUILD[q.need].name.toLowerCase()}</b>`:''} pour devenir un <b>${LEVEL_NAMES[S.level+1]}</b>.`};

/* ---------- Bâtir ---------- */
function buildList(){
  let h=`<p class="muted">${PRESEL!==null?'Choisis ce que tu veux construire sur ce terrain.':'Choisis un bâtiment, puis touche un terrain libre.'}</p>`;
  const free=S.plots.slice(0,plotsN()).filter(p=>!p).length;
  if(!free)h+=`<div class="card">Plus de terrain libre ! Améliore tes maisons ou monte de niveau pour débloquer de nouveaux terrains.</div>`;
  CATS.forEach(cat=>{
    const items=Object.entries(BUILD).filter(([k,d])=>d.cat===cat&&(!d.special||S.unlocks[k])&&(!d.plan||S.planKiosque));
    if(cat==='Récompenses'&&!items.length){h+=`<h3>Récompenses</h3><p class="muted">Des bâtiments spéciaux se gagnent dans les autres jeux du lanceur (onglet Jeux).</p>`;return}
    if(!items.length)return;
    h+=`<h3>${cat}</h3><div class="bgrid">`;
    items.forEach(([k,d])=>{const L=d.levels[0];const built=d.unique&&has(k);const locked=S.level<L.min;
      const th=thumb(k,1);
      h+=`<button class="bcard ${locked||built?'locked':''}" data-act="pick" data-k="${k}">${locked?`<span class="tag">Niv. ${L.min}</span>`:built?`<span class="tag">Construit</span>`:''}<div class="th">${th}</div><b>${k==='maison'?'Tente':d.name}</b><div>${locked||built?'':costHTML(L.cost)}</div><div class="muted" style="font-size:12px;line-height:1.3">${shortEffect(k,1)}</div></button>`});
    h+='</div>';
  });
  return h;
}
function thumb(k,l){const d=DRAW[k](0,200,l,'#B5D4F4');const top=Math.min(d.top,200-100);return `<svg viewBox="-6 ${top-6} 120 ${206-top+6}" preserveAspectRatio="xMidYMax meet">${d.s}</svg>`}
function shortEffect(k,l){const d=BUILD[k],L=d.levels[l-1];if(L.pop)return `+${L.pop} habitants`;if(L.prod){const [r,v]=Object.entries(L.prod)[0];return `+${v} ${RES_NAME[r]} / jour`}if(L.protect)return `Protège ${L.protect} dollars`;return d.desc.split('.')[0]}
function pick(k){
  const d=BUILD[k],L=d.levels[0];
  if(S.level<L.min)return toast(`Débloqué au niveau ${L.min} (${LEVEL_NAMES[L.min]}).`);
  if(d.unique&&has(k))return toast('Tu as déjà ce bâtiment. Touche-le en ville pour l’améliorer.');
  if(!canPay(L.cost))return toast('Pas assez de ressources. Va jouer dans l’onglet Jeux !');
  if(PRESEL!==null){placeAt(PRESEL,k);PRESEL=null;closeSheet();return}
  if(!S.plots.slice(0,plotsN()).some(p=>!p))return toast('Aucun terrain libre.');
  PENDING=k;closeSheet();renderAll();
}
function placeAt(i,k){
  const L=BUILD[k].levels[0];if(!canPay(L.cost))return toast('Pas assez de ressources.');
  pay(L.cost);S.plots[i]={t:k,l:1,c:100,last:now(),born:now()};PENDING=null;save();renderAll();
  toast(`${k==='maison'?'Tente':BUILD[k].name} construit !`,()=>{if(S.plots[i]&&S.plots[i].t===k&&S.plots[i].l===1){S.plots[i]=null;Object.entries(L.cost).forEach(([r,v])=>S.res[r]+=v);save();renderAll()}});
  setTimeout(()=>{if(S.plots[i])delete S.plots[i].born;computeLevel()},1600);
}

  if(nx){const lockedN=S.level<nx.min;h+=`<div class="card" style="border-style:dashed"><b>${p.t==='maison'?nx.n:'Niveau '+(p.l+1)}</b> — ${shortEffect(p.t,p.l+1)}${p.t==='sherif'?` · chasses ${Math.round(nx.hunt*(has('ecurie')?.75:1))} h`:''}<div style="margin-top:4px">${lockedN?`<span class="chip">Débloqué au niveau ${nx.min}</span>`:costHTML(nx.cost)}</div></div>`}
  h+=`<div class="btns">`;
  if(r&&r.n>=1)h+=`<button class="btn green" data-act="collect" data-i="${i}">Récolter +${r.n}</button>`;
  if(p.c<100)h+=`<button class="btn" data-act="repair" data-i="${i}">Réparer ${costHTML(repairCost(p))}</button>`;
  if(nx)h+=`<button class="btn primary" data-act="upgrade" data-i="${i}">Améliorer</button>`;
  h+=`</div><div class="btns"><button class="btn small" style="margin-left:auto;flex:none" data-act="demolish" data-i="${i}">Démolir</button></div>`;
  if(p.t==='magasin')h+=exchangeHTML();
  if(p.t==='sorciere')h+=`<h3>Le chaudron</h3><p class="muted">5 foin → 1 magie (3 fois par jour). Aujourd’hui : ${S.daily.cauldron}/3</p><button class="btn full" data-act="cauldron">Touiller le chaudron</button>`;
  if(p.t==='ecole')h+=missionsHTML();
  if(p.t==='journal')h+=`<div class="btns"><button class="btn full" data-act="readGazette">Lire La Gazette</button></div>`;
  if(p.t==='sherif')h+=`<div class="btns"><button class="btn full" data-act="navPost">Voir le mur des affiches</button></div>`;
  return h;
}
function refundOf(p){const r={};BUILD[p.t].levels.slice(0,p.l).forEach(L=>Object.entries(L.cost).forEach(([k,v])=>r[k]=(r[k]||0)+Math.floor(v/2)));return r}
function demolishAsk(i){const p=S.plots[i];openModal(`<h2>Démolir ${bName(p)} ?</h2><p style="text-align:center">Le terrain redevient libre et tu récupères la moitié de ce qu’il a coûté :</p><p style="text-align:center">${costHTML(refundOf(p))}</p><div class="btns"><button class="btn" data-act="closeModal">Garder</button><button class="btn red" data-act="demolishOk" data-i="${i}">Démolir</button></div>`)}
function demolish(i){const p=S.plots[i];if(!p)return;const r=refundOf(p),n=bName(p);Object.entries(r).forEach(([k,v])=>S.res[k]+=v);S.plots[i]=null;flashRes(Object.keys(r),'flash');save();closeModal();closeSheet();renderAll();toast(`${n} démoli. Le terrain est libre.`)}
function upgrade(i){const p=S.plots[i],nx=BUILD[p.t].levels[p.l];if(!nx)return;if(S.level<nx.min)return toast(`Il faut être ${LEVEL_NAMES[nx.min]} (niveau ${nx.min}).`);if(!canPay(nx.cost))return toast('Pas assez de ressources.');
  const r=ready(p);if(r&&r.n)gain(r.r,r.n);pay(nx.cost);p.l++;p.last=now();p.born=now();p.c=100;save();renderAll();openSheet(bName(p),()=>bldSheet(i));toast(`${bName(p)} : niveau ${p.l} !`);setTimeout(()=>{delete p.born;computeLevel()},1600)}
function repair(i){const p=S.plots[i],c=repairCost(p);if(!canPay(c))return toast('Il te faut du bois pour réparer.');pay(c);p.c=100;S.daily.miss.repair++;save();renderAll();toast(`${bName(p)} est comme neuf !`)}
function collect(i){const p=S.plots[i],r=ready(p);if(!r||r.n<1)return;gain(r.r,r.n);p.last=now();S.collected=true;S.daily.miss.collect++;save();renderAll();toast(`+${r.n} ${RES_NAME[r.r]}`)}
function exchangeHTML(){return `<h3>Échange</h3><p class="muted">Donne 3, reçois 1.</p><div class="row"><select class="field" id="exFrom">${['p','b','pi','f'].map(r=>`<option value="${r}">3 ${RES_NAME[r]}</option>`).join('')}</select><span style="font-size:20px">→</span><select class="field" id="exTo">${['b','pi','f','p'].map(r=>`<option value="${r}">1 ${RES_NAME[r]}</option>`).join('')}</select></div><div class="err" id="exErr"></div><button class="btn full primary" style="margin-top:8px" data-act="exchange">Échanger</button>`}
function missionsHTML(){const m=S.daily.miss;const L=[['collect','Récolter 3 fois',3],['repair','Réparer un bâtiment',1],['poster','Créer une affiche',1]];

function huntHours(){const l=sheriffLvl();if(!l)return 0;return Math.round(BUILD.sherif.levels[l-1].hunt*(has('ecurie')?.75:1))}
function defSheet(){
  const ri=riskInfo(0),vac=S.vacationUntil>now();
  let h=`<div class="card"><div class="row"><div class="grow"><b>Risque d’attaque cette nuit</b></div><b style="font-size:22px">${vac?0:ri.risk} %</b></div><div class="pbar ${ri.risk>=40?'bad':ri.risk>=20?'warn':''}" style="margin-top:6px"><i style="width:${(vac?0:ri.risk)/60*100}%"></i></div>`;
  h+=ri.f.map(([t,v])=>`<div class="kv"><span>${t}</span><span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${v} %</span></div>`).join('');
  if(vac)h+=`<div class="kv"><span>Fermé pour vacances</span><span class="neg">aucune attaque</span></div>`;
  h+=`<p class="muted" style="margin-top:6px">Chaque jour sans jouer ajoute +10 % (jusqu’à +30 %). Jamais plus de 60 %, jamais plus d’une attaque par nuit.</p></div>`;
  h+=`<h3>Ce qui est à l’abri</h3><div class="card"><div class="kv"><span>Pièces protégées</span><b>${fmt(protectedP())} / ${fmt(S.res.p)}</b></div><div class="kv"><span>Plancher de sécurité</span><b>50 dollars</b></div>${sheriffLvl()?`<div class="kv"><span>Shérif niveau ${sheriffLvl()}</span><b>+${BUILD.sherif.levels[sheriffLvl()-1].protect}</b></div>`:''}${has('banque')?`<div class="kv"><span>Banque</span><b>30 % des dollars</b></div>`:''}${S.guardDog?`<div class="kv"><span>Chien de garde</span><b>fait fuir 1 bandit sur 3</b></div>`:''}</div>`;
  const hunts=S.posters.filter(p=>p.hunt&&!p.captured);
  h+=`<h3>Chasses en cours</h3>`+(hunts.length?hunts.map(p=>{const pr=Math.min(1,(now()-p.hunt.start)/(p.hunt.end-p.hunt.start));const left=Math.max(0,p.hunt.end-now());return `<div class="card"><div class="row"><b class="grow">Le shérif traque ${esc(p.name)}</b><span>${Math.floor(left/HOUR)} h ${Math.floor(left%HOUR/60000)} min</span></div><div class="pbar" style="margin-top:6px"><i style="width:${pr*100}%"></i></div><div class="muted" style="margin-top:4px">À récupérer : ${p.loot.n} ${RES_NAME[p.loot.r]} + 25 % de bonus</div></div>`}).join(''):`<p class="muted">${has('sherif')?'Aucune chasse. Lance-en une depuis les Affiches quand un bandit t’a volé.':'Construis le bureau du shérif (niveau 3) pour pouvoir pourchasser les bandits.'}</p>`);
  h+=`<h3>Bâtiments de défense</h3><div class="bgrid">${['sherif','banque','tour','prison'].map(k=>`<div class="bcard ${has(k)?'':'locked'}"><span class="tag">${has(k)?'Construit':k==='prison'?'Récompense':'Niv. '+BUILD[k].levels[0].min}</span><div class="th">${thumb(k,1)}</div><b>${BUILD[k].name}</b><div class="muted" style="font-size:12px">${shortEffect(k,1)}</div></div>`).join('')}</div>`;
  return h;
}

function processDays(n){
  const ev=[],t=now(),vac=S.vacationUntil>t,idle=Math.max(0,n-1);
  if(!vac){
    if(idle>0){let any=false;S.plots.forEach((p,i)=>{if(!p||nearWell(S,i))return;const o=p.c;p.c=Math.max(30,p.c-(has('docteur')?5:10)*idle);if(p.c<o)any=true});if(any)ev.push({ic:'🕸',h:'La poussière s’installe',t:`${idle} jour${idle>1?'s':''} sans visite : des bâtiments sont poussiéreux et produisent moins.`})}
    const cand=S.plots.map((p,i)=>p&&!nearWell(S,i)?i:-1).filter(i=>i>=0);
    if(cand.length&&Math.random()<.3){const p=S.plots[rnd(cand)];p.c=Math.max(30,p.c-15);ev.push({ic:'🌪',h:'Tempête de sable',t:`Le vent a abîmé : ${bName(p)}. Un coup de marteau et il n’y paraîtra plus.`})}
  } else ev.push({ic:'🏖',h:'Fermé pour vacances',t:'Rien ne s’abîme et aucun bandit ne s’approche.'});
  const td=dayKey(t);
  if(has('gare')||td%3===0){S.merchantDay=td;ev.push({ic:'🛒',h:'Pedro est en ville',t:'Le marchand ambulant déballe sa charrette jusqu’à ce soir.'})}
  if(has('train')){const g=rnd([{p:60},{b:30},{pi:30},{f:30},{m:8}]);Object.entries(g).forEach(([r,v])=>S.res[r]+=v);ev.push({ic:'🚂',h:'Le train est passé',t:'Il a livré un colis surprise : '+Object.entries(g).map(([r,v])=>`${v} ${RES_NAME[r]}`).join(', ')+'.'})}
  S.daily=freshDaily();
  let raid=false;
  if(!vac){const ri=riskInfo(idle);if(ri.risk>0&&Math.random()*100<ri.risk){if(S.guardDog&&Math.random()<1/3)ev.push({ic:'🐕',h:'Bandits mis en fuite',t:'Des bandits ont rôdé, mais ton chien de garde a aboyé si fort qu’ils ont filé !'});else raid=true}}
  S.gazette={day:td,ev};S.lastDay=td;save();
  if(raid)raidPrompt();else if(ev.length)showGazette();
}
function showGazette(){
  const g=S.gazette;if(!g)return toast('Pas encore de Gazette.');
  const d=g.day-dayKey(S.created)+1;
  openModal(`<div class="gz"><div class="mast">La Gazette<br><span style="font-size:15px">de ${esc(S.name)}</span></div><div class="date"><span>Jour ${d}</span><span>${has('journal')?'édition couleur':'1 cent'}</span></div>${g.ev.length?g.ev.map(e=>`<div class="item"><b>${e.ic||''} ${e.h||''}</b>${e.t}${e.poster?`<div style="width:46%;margin:8px auto 0">${posterSVG(S.posters.find(p=>p.id===e.poster)||macPoster())}</div>`:''}</div>`).join(''):'<div class="item">Journée calme à '+esc(S.name)+'. Le shérif fait la sieste.</div>'}</div><button class="btn primary full" style="margin-top:12px" data-act="closeModal">Au travail !</button>`);
}
function raidPrompt(){
  const r=computeRaid();
  if(r.amt<1){S.gazette.ev.push({ic:'🤠',h:'Bandits bredouilles',t:'Les bandits ont fouillé la ville… et sont repartis les mains vides. Tout était à l’abri !'});save();return showGazette()}
  window._raid=r;
  const auto=sheriffLvl()?.3+.15*sheriffLvl():.2;
  openModal(`<div style="background:#26215C;border-radius:12px;padding:12px;color:#FAEEDA;text-align:center"><div class="west" style="font-size:24px;color:#FAC775">Les bandits attaquent !</div><svg viewBox="0 0 120 110" style="width:120px;margin:8px auto;display:block;border-radius:10px">${face(randomFace(true))}</svg>Ils visent ton stock de <b>${RES_NAME[r.r]}</b> : jusqu’à <b>${r.amt}</b> !</div>
  <div class="btns" style="flex-direction:column"><button class="btn red full" data-act="raidPlay">Défendre la ville (20 s)</button><button class="btn full" data-act="raidAuto" data-v="${auto}">Laisser faire le shérif (sauve ${Math.round(auto*100)} %)</button></div>`);
}
function computeRaid(){const c=[['p',S.res.p-protectedP()],['b',S.res.b-5],['pi',S.res.pi-5],['f',S.res.f-5]].map(([r,u])=>[r,Math.max(0,u)]).sort((a,b)=>b[1]-a[1]);const [r,u]=c[0];return {r,amt:u>0?Math.max(1,Math.round(u*(.1+Math.random()*.1))):0}}
function resolveRaid(saved){
  const r=window._raid;const lost=Math.round(r.amt*(1-saved));
  if(lost<1){S.gazette.ev.push({ic:'⭐',h:'Attaque repoussée !',t:'Les bandits sont repartis sans rien. Quelle défense !'});save();renderAll();return showGazette()}
  S.res[r.r]-=lost;flashRes([r.r],'lose');
  const p={id:uid(),kind:'bandit',author:'La Gazette',name:randomNick(),crime:`A volé ${lost} ${RES_NAME[r.r]} à ${S.name}`,reward:lost*25+rnd([0,50,100]),face:randomFace(true),paper:'vieilli',stamp:'MORT OU VIF',captured:false,loot:{r:r.r,n:lost},day:today()};
  S.posters.push(p);
  S.gazette.ev.unshift({ic:'💰',h:`Vol à ${S.name} !`,t:`${saved>0?`Tu as sauvé ${Math.round(saved*100)} % du butin, mais `:''}${p.name} a filé avec ${lost} ${RES_NAME[r.r]}. ${has('sherif')?'Lance une chasse pour tout récupérer, avec un bonus !':'Construis le bureau du shérif pour le pourchasser.'}`,poster:p.id});
  save();renderAll();showGazette();
}
function raidGame(){
  closeModal();const box=document.getElementById('raidBox');
  box.innerHTML=`<div class="raid"><div class="raid-top"><span class="west">Défends ${esc(S.name)} !</span><span class="raid-time" id="rt">20</span></div><div class="raid-field" id="rf"><svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice"><rect width="400" height="600" fill="#141033"/>${Array.from({length:40},(_,i)=>`<circle cx="${hash(i)*400}" cy="${hash(i+9)*240}" r="1.3" fill="#FAEEDA"/>`).join('')}<circle cx="320" cy="80" r="26" fill="#FAEEDA"/><circle cx="332" cy="72" r="24" fill="#141033"/>
  <path d="M0 330V200h90v-14h20v144z" fill="#26215C" stroke="#3C3489" stroke-width="3"/><path d="M110 330V170h120v160z" fill="#26215C" stroke="#3C3489" stroke-width="3"/><path d="M230 330V210h80l20-16 20 16h50v120z" fill="#26215C" stroke="#3C3489" stroke-width="3"/>
  ${[[20,230],[60,230],[130,200],[190,200],[130,260],[250,240],[330,240]].map(([x,y])=>`<rect class="flick" x="${x}" y="${y}" width="22" height="28" fill="#FAC775"/>`).join('')}<rect x="0" y="330" width="400" height="270" fill="#633806"/><rect x="0" y="330" width="400" height="14" fill="#412402"/></svg></div>
  <div class="raid-bottom"><div class="raid-bar"><i id="rb" style="width:100%"></i><span id="rbt">Butin sauvé : 100 %</span></div><p style="text-align:center;margin:8px 0 0;font-size:15px">Touche les bandits avant qu’ils filent !</p></div></div>`;
  const rf=document.getElementById('rf');let hits=0,done=0,alive=0,t0=performance.now(),over=false;
  const spots=[[18,62],[38,58],[60,62],[80,60],[28,80],[52,84],[74,82],[12,92],[88,92],[45,70]];
  const upd=()=>{const pct=done?Math.round(hits/done*100):100;document.getElementById('rb').style.width=pct+'%';document.getElementById('rbt').textContent=`Butin sauvé : ${pct} %`};
  function spawn(){
    if(over)return;const el=performance.now()-t0;if(el>20000){over=true;return}
    const [x,y]=rnd(spots),b=document.createElement('button');b.className='bandit';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','Bandit');
    b.innerHTML=`<svg viewBox="0 0 120 140"><g transform="translate(0 10)">${face(randomFace(true)).replace('<rect width="120" height="110" fill="#F5DDBB"/>','')}</g><rect x="20" y="118" width="80" height="22" rx="6" fill="#2C2C2A"/></svg>`;
    alive++;rf.appendChild(b);let gone=false;
    const life=Math.max(750,1350-el/30);
    const fin=hit=>{if(gone)return;gone=true;alive--;done++;if(hit){hits++;b.classList.add('hit');const pn=document.createElement('div');pn.className='pan';pn.textContent=rnd(['Pan !','Bang !','Ouille !']);pn.style.left=x+'%';pn.style.top=(y-8)+'%';rf.appendChild(pn);setTimeout(()=>pn.remove(),600)}else b.classList.add('run');setTimeout(()=>b.remove(),350);upd();if(over&&alive===0)end()};
    b.addEventListener('pointerdown',e=>{e.preventDefault();fin(true)});setTimeout(()=>fin(false),life);
    setTimeout(spawn,Math.max(380,700-el/50));
  }
  const timer=setInterval(()=>{const left=Math.max(0,20-Math.floor((performance.now()-t0)/1000));document.getElementById('rt').textContent=left;if(left<=0){clearInterval(timer);over=true;if(alive===0)end()}},200);
  let ended=false;function end(){if(ended)return;ended=true;const saved=done?hits/done:1;setTimeout(()=>{box.innerHTML='';resolveRaid(saved);toast(`${hits} bandit${hits>1?'s':''} touché${hits>1?'s':''} sur ${done}`)},500)}
  setTimeout(spawn,600);
}

/* ---------- Niveau ---------- */
function showLevelUp(o,n){
  const news=Object.entries(BUILD).filter(([k,d])=>!d.special&&!d.plan&&d.levels.some((L,i)=>L.min===n)).map(([k,d])=>k==='maison'?BUILD.maison.levels.find(L=>L.min===n).n:d.name);
  openModal(`<div style="text-align:center">${gusFace().replace('class="face"','style="width:80px"')}<h2>${esc(S.name)} devient ${ART[n]} ${LEVEL_NAMES[n]} !</h2><p>+${PLOTS[n]-PLOTS[o]} terrains à bâtir</p>${news.length?`<p><b>Nouveaux bâtiments :</b><br>${news.join(' · ')}</p>`:''}</div><button class="btn primary full" data-act="closeModal">Hourra !</button>`);
}

/* ---------- Réglages ---------- */
function settingsSheet(){
  const vac=S.vacationUntil>now(),left=Math.ceil((S.vacationUntil-now())/DAY);
  return `<h3>Nom de la ville</h3><div class="row"><input class="field" id="tName" maxlength="18" value="${esc(S.name)}"><button class="btn small primary" data-act="rename">OK</button></div><div class="err" id="tNameErr"></div>
  <h3>Fermé pour vacances</h3><p class="muted">Pendant les vacances : pas de poussière, pas de bandits. Jusqu’à 14 jours.</p>
  ${vac?`<div class="card row"><b class="grow">Fermé encore ${left} jour${left>1?'s':''}</b><button class="btn small" data-act="vac" data-v="0">Rouvrir</button></div>`:`<div class="toggle">${[3,7,14].map(d=>`<button class="tab" data-act="vac" data-v="${d}">${d} jours</button>`).join('')}</div>`}
  <h3>La Gazette</h3><button class="btn full" data-act="readGazette">Relire la dernière Gazette</button>
  <h3>Sauvegarde</h3><p class="muted">${!ME?'Tu n’es pas connecté : ta ville est gardée sur cet appareil seulement. Connecte-toi sur Mes Jeux pour la sauvegarder.':REMOTE?`Ta ville est sauvegardée en ligne, au nom de <b>${esc(ME.pseudo)}</b>.`:'Sauvegarde en ligne indisponible : ta ville est gardée sur cet appareil.'}</p>
  <h3>Version</h3><div class="card row"><div class="grow"><b>Version ${VERSION}</b><div class="muted">${NEWVER?'Une nouvelle version est disponible.':'Recharge le jeu pour être sûr d’avoir la dernière version.'}</div></div><button class="btn small ${NEWVER?'green':'primary'}" data-act="update">Mettre à jour</button></div>
  <a class="btn full" href="../" style="text-decoration:none">← Retour à Mes Jeux</a>
  ${DEV?`<h3>Outils de test</h3>
  <div class="btns" style="flex-wrap:wrap"><button class="btn small" data-act="dev" data-v="day">⏩ Avancer d’1 jour</button><button class="btn small" data-act="dev" data-v="day3">⏩ 3 jours (absence)</button><button class="btn small" data-act="dev" data-v="hour">⏩ +6 heures</button><button class="btn small" data-act="dev" data-v="raid">Attaque maintenant</button><button class="btn small" data-act="dev" data-v="merchant">Faire venir Pedro</button><button class="btn small" data-act="dev" data-v="rich">+500 de tout</button><button class="btn small" data-act="dev" data-v="beginner">${S.noBeginner?'Rétablir':'Retirer'} la protection débutant</button><button class="btn small red" data-act="dev" data-v="reset">Tout recommencer</button></div>`:''}`;
}
function dev(v){
  if(v==='day'){S.offset+=DAY;tick(true)}
  if(v==='day3'){S.offset+=3*DAY;tick(true)}
  if(v==='hour'){S.offset+=6*HOUR;tick(true);toast('6 heures passent…')}
  if(v==='raid'){closeSheet();S.gazette=S.gazette&&S.gazette.day===today()?S.gazette:{day:today(),ev:[]};raidPrompt();return}
  if(v==='merchant'){S.merchantDay=today();closeSheet();toast('Pedro arrive en ville !')}
  if(v==='rich'){RES.forEach(r=>S.res[r]+=500);flashRes(RES,'flash')}
  if(v==='beginner'){S.noBeginner=!S.noBeginner}
  if(v==='reset'){if(!confirm('Effacer ta ville et tout recommencer ?'))return;S=freshState();closeSheet()}
  save();renderAll();
}

/* ================== Actions ================== */
const ACT={
  closeSheet,closeModal,
  gusX:d=>{S.gusSeen.push(d.k);save();renderGus()},
  navBuild:()=>{PRESEL=null;PENDING=null;openSheet('Bâtir',buildList)},
  navDef:()=>openSheet('Défense',defSheet),
  navPost:()=>{closeModal();openSheet(has('sherif')?'Mur du shérif':'Mes affiches',postersSheet)},
  navVisit:()=>openSheet('Visiter',visitSheet),
  navGames:()=>{closeModal();openSheet('Jeux du lanceur',gamesSheet)},
  settings:()=>{if(!VISIT)openSheet('Réglages',settingsSheet)},
  pick:d=>pick(d.k),
  cancelPending:()=>{PENDING=null;renderAll()},
  plot:d=>{const i=+d.i;if(PENDING){placeAt(i,PENDING);return}PRESEL=i;openSheet('Bâtir ici',buildList)},
  bld:d=>{const p=S.plots[+d.i];if(PENDING)return toast('Ce terrain est occupé. Choisis un terrain vert.');openSheet(bName(p),()=>bldSheet(+d.i))},
  collect:d=>collect(+d.i),
  upgrade:d=>upgrade(+d.i),demolish:d=>demolishAsk(+d.i),demolishOk:d=>demolish(+d.i),
  repair:d=>repair(+d.i),
  exchange:()=>{const f=document.getElementById('exFrom').value,t=document.getElementById('exTo').value;const e=document.getElementById('exErr');if(f===t){e.textContent='Choisis deux ressources différentes.';return}if(S.res[f]<3){e.textContent=`Il te faut 3 ${RES_NAME[f]}.`;return}S.res[f]-=3;gain(t,1);flashRes([f],'lose');save();renderHUD();toast(`+1 ${RES_NAME[t]}`)},
  cauldron:()=>{if(S.daily.cauldron>=3)return toast('Le chaudron doit refroidir jusqu’à demain.');if(S.res.f<5)return toast('Il faut 5 foin.');S.res.f-=5;S.daily.cauldron++;gain('m',1);save();renderHUD();refreshSheet();toast('Blop ! +1 magie')},
  claim:d=>{const n={collect:3,repair:1,poster:1}[d.k];if(S.daily.miss[d.k]<n)return toast('Mission pas encore terminée.');S.daily.claimed[d.k]=true;gain('p',20);save();renderHUD();refreshSheet()},
  readGazette:()=>{closeSheet();showGazette()},
  openFamPoster:d=>openFamPoster(d.id),newPoster,editPoster:d=>editPoster(d.id),openPoster:d=>openPoster(d.id),hunt:d=>startHunt(d.id),downloadPoster:d=>downloadPoster(d.id),
  etab:d=>{syncText();EDIT_TAB=d.k;refreshSheet()},
  setOpt:d=>setOpt(d.f,d.v,+d.price),
  setStamp:d=>{EDIT.stamp=d.v;refreshSheet()},
  setReward:d=>{syncText();EDIT.reward=+d.v;refreshSheet()},
  randName:()=>{EDIT.name=randomNick();refreshSheet()},
  randCrime:()=>{syncText();EDIT.crime=rnd(CRIMES);refreshSheet()},
  randAll:()=>{const f=randomFace(false);Object.keys(f).forEach(k=>{const opt=(FACE_OPTS[k]||[]).find(o=>Array.isArray(o)&&o[0]===f[k]);if(!opt||!opt[2])EDIT.face[k]=f[k]});EDIT.name=randomNick();EDIT.crime=rnd(CRIMES);refreshSheet()},
  savePoster,
  simGame:d=>{const r={courrier:{b:12},cubix:{pi:10},ranch:{f:6},witch:{m:3},cowboy:{}}[d.k];mergeGains([{d:MesJeuxToday(),g:d.k,r:{p:25,...r},u:d.k==='cowboy'?'prison':undefined,anneaux:d.k==='witch'?120:0}]);save();renderAll();refreshSheet()},
  visit:d=>{VISIT=d.id;closeSheet();document.getElementById('scene').scrollLeft=0;renderAll()},
  visitBack:()=>{VISIT=null;renderAll()},
  like:()=>{if(S.daily.likes[VISIT])return toast('Tu as déjà aimé cette ville aujourd’hui.');const f=friends().find(x=>x.id===VISIT);f.likes++;S.daily.likes[VISIT]=true;sendTo(f,{like:1});save();renderAll();toast(`♥ ${f.owner} va adorer !`)},
  helpInfo:()=>toast(S.daily.helps>=2?'Plus de coups de main aujourd’hui.':'Touche un bâtiment marqué « À réparer ».'),
  gift:()=>{if(S.daily.gifts[VISIT])return toast('Un cadeau par jour et par ville.');if(S.res.b<10)return toast('Il te faut 10 bois à offrir.');S.res.b-=10;flashRes(['b'],'lose');S.daily.gifts[VISIT]=true;sendTo(friends().find(x=>x.id===VISIT),{gift:{b:10}});save();renderAll();toast(`10 bois envoyés à ${friends().find(x=>x.id===VISIT).owner} 🎁`)},
  vbld:d=>vbld(+d.i),
  merchant:()=>openSheet('Chez Pedro',merchantSheet),
  buy:d=>buy(d.k),
  swap:()=>{if(S.res.b<3)return toast('Il faut 3 bois.');S.res.b-=3;S.daily.swap=1;gain('pi',1);save();renderHUD();refreshSheet()},
  raidPlay:()=>raidGame(),
  raidAuto:d=>{closeModal();resolveRaid(+d.v)},
  villager:()=>toast(rnd(['« Belle journée, hein ? »','« Le saloon sert la meilleure limonade de l’Ouest ! »','« Paraît que Mac Blain rôde encore… »','« Attrape les virevoltants, ça porte bonheur ! »','« Ma maison aurait bien besoin d’un coup de balai. »'])),
  tumble:(d,el)=>{el.remove();if(S.daily.tumble>=10)return;S.daily.tumble++;gain('p',1);save();renderHUD();toast('Virevoltant attrapé ! +1 dollar')},
  rename:()=>{const v=document.getElementById('tName').value.trim();if(!v){document.getElementById('tNameErr').textContent='Ta ville a besoin d’un nom.';return}S.name=v;save();renderAll();toast('Nouveau panneau à l’entrée de la ville !')},
  vac:d=>{S.vacationUntil=+d.v?now()+ +d.v*DAY:0;save();refreshSheet();toast(+d.v?`Fermé pour ${d.v} jours.`:'La ville rouvre !')},
  dev:d=>dev(d.v),
  contest:()=>{closeModal();openSheet('Concours d’affiches',contestSheet)},
  contestPick:()=>openSheet('Inscrire une affiche',contestPickSheet),
  contestEnter:d=>{const w=weekId();if(S.contest&&S.contest.week!==w)S.contestPrev=S.contest;const keep=S.contest&&S.contest.week===w?S.contest.votes||0:0;S.contest={week:w,posterId:d.id,votes:keep};save();closeModal();openSheet('Concours d’affiches',contestSheet);toast('Ton affiche est inscrite au concours !');if(ME&&window.MesJeux&&keep===0)MesJeux.evenement('🖼️',`${ME.pseudo} participe au concours d’affiches « ${themeOf(w)} »`)},
  vote:d=>{const w=weekId();if(S.voted&&S.voted.week===w)return toast('Tu as déjà voté cette semaine.');const f=(FAM||[]).find(x=>x.id===d.id);if(!f)return;S.voted={week:w,id:d.id};f.contest.votes=(f.contest.votes||0)+1;sendTo(f,{vote:w});save();refreshSheet();toast(`Ton vote pour l’affiche de ${f.owner} est envoyé !`)},
  update:()=>reloadFresh(),
};
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.id==='modal')return;
  const a=ACT[el.dataset.act];if(a)a(el.dataset,el);
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ================== Boucle ================== */
function spawnTumble(){
  if(VISIT||document.hidden)return;const layer=document.getElementById('tumbleLayer');if(!layer||S.daily.tumble>=10)return;
  const svg=layer.ownerSVGElement,W=svg.viewBox.baseVal.width;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','tap');g.dataset.act='tumble';
  g.innerHTML=`<animateTransform attributeName="transform" type="translate" from="-40 ${GY+70}" to="${W+40} ${GY+64}" dur="14s" fill="freeze"/><g class="spin" style="animation-duration:1.4s"><circle r="15" fill="#BA7517" opacity=".35"/><circle r="15" fill="none" stroke="#854F0B" stroke-width="2" stroke-dasharray="4 3"/><path d="M-10-6q10 14 20 0M-8 8q8-14 16 0M-12 2h24" stroke="#633806" stroke-width="1.6" fill="none"/></g><animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -14;0 0;0 -8;0 0" dur="1.4s" repeatCount="indefinite"/>`;
  layer.appendChild(g);setTimeout(()=>g.remove(),14500);
}
function tick(force){
  const td=today();
  if(td>S.lastDay){const n=td-S.lastDay;processDays(n)}
  checkHunts();
  computeLevel();
  if(force||sig()!==LASTSIG){renderAll();if(CUR)refreshSheet()}
}
S=load()||freshState();
if(!S.friends)S.friends=makeFriends();
if(!S.caps)S.caps={};
while(S.plots.length<26)S.plots.push(null);
renderAll();
tick();
loadRemote().then(()=>{renderAll();tick(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pushRemote(true);else{checkGains();checkVersion()}});
checkVersion();setInterval(checkVersion,300000);
window.addEventListener('pagehide',()=>pushRemote(true));
setInterval(tick,3000);
setInterval(()=>{if(Math.random()<.5)spawnTumble()},12000);
setTimeout(spawnTumble,4000);
</script>
