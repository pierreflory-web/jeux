<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Painting Further Away</title>
<meta name="description" content="Repeins tout le terrain avec ton avatar : sors de ta zone, fais une boucle et reviens.">
<meta name="theme-color" content="#1B1F3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painting">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
  :root {
    --nuit: #1B1F3B;
    --nuit2: #232850;
    --nuit3: #2A3060;
    --encre: #0E1128;
    --papier: #F4F1FF;
    --brume: #B9BCE0;
    --bord: #4A5080;
    --jaune: #FFD23F;
    --tomate: #FF5A4E;
    --menthe: #3DDC97;
    --lagon: #2EC4F1;
    --sol: #F1EEFA;
    --titre: 'Bagel Fat One', 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
    --texte: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--nuit);
    color: var(--papier);
    font-family: var(--texte);
    font-size: 17px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--jaune); outline-offset: 3px; }

  .ecran {
    min-height: 100%;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* ——— Boutons ——— */
  .btn {
    min-height: 60px; padding: 0 28px; border: 0; border-radius: 32px;
    font-size: 20px; font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 0 var(--encre); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--encre); }
  .btn.clair { background: var(--papier); color: var(--nuit); }
  .btn.rouge { background: var(--tomate); color: #fff; }
  .btn.contour {
    background: transparent; color: var(--papier); border: 2px solid var(--bord);
    box-shadow: none; min-height: 48px; font-size: 17px; font-weight: 500; padding: 0 20px;
  }

  /* ——— Accueil ——— */
  #accueil {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    text-align: center;
  }
  .tache { position: absolute; pointer-events: none; }
  #accueil h1 {
    position: relative; margin: 0;
    font-family: var(--titre); font-weight: 400;
    font-size: clamp(48px, 10vw, 92px); line-height: .95; letter-spacing: .5px;
    text-shadow: 6px 6px 0 var(--encre); text-wrap: balance;
  }
  #quiJoue { position: relative; margin: -12px 0 0; color: var(--brume); font-size: 17px; }
  #quiJoue b { color: var(--papier); }
  .avatar-accueil { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #nomAccueil { font-size: 22px; font-weight: 600; }
  .boutons { position: relative; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .boutons .btn { min-width: 230px; }
  .retour-mesjeux { position: relative; color: var(--brume); font-size: 15px; text-decoration: none; }
  .retour-mesjeux:hover { color: var(--jaune); }

  /* ——— Avatars ——— */
  #avatars { display: flex; flex-direction: column; gap: 22px; max-width: 1180px; margin: 0 auto; }
  .entete { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .entete h1 {
    margin: 0; font-family: var(--titre); font-weight: 400;
    font-size: clamp(32px, 6vw, 52px); text-shadow: 4px 4px 0 var(--encre);
  }
  .compteur { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .compteur b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .compteur span, .etiquette { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--brume); }
  .onglets { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .onglets button {
    height: 46px; padding: 0 20px; border-radius: 23px; border: 2px solid var(--bord);
    background: transparent; color: var(--papier); font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .onglets button[aria-pressed="true"] { background: var(--jaune); border-color: var(--jaune); color: var(--nuit); }
  #grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .carte {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 8px 14px; border-radius: 24px; border: 4px solid transparent;
    background: var(--nuit2); color: var(--papier); cursor: pointer; text-align: center; min-width: 0;
  }
  .carte:hover { background: var(--nuit3); }
  .carte.choisi { background: var(--nuit3); border-color: var(--jaune); }
  .carte.verrou { cursor: default; }
  .carte.verrou:hover { background: var(--nuit2); }
  .carte canvas { display: block; }
  .carte.verrou canvas { filter: grayscale(1); opacity: .35; }
  .cadenas {
    position: absolute; left: 50%; top: 58px; transform: translateX(-50%);
    width: 50px; height: 50px; border-radius: 50%; background: var(--nuit);
    box-shadow: 0 0 0 3px var(--bord); display: flex; align-items: center; justify-content: center;
  }
  .carte .nom { font-size: 17px; font-weight: 600; }
  .carte .ok { font-size: 13px; color: var(--menthe); min-height: 34px; }
  .mission { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }
  .mission p { margin: 0; font-size: 13px; line-height: 1.3; color: var(--brume); min-height: 34px; }
  .progres { display: flex; align-items: center; gap: 8px; }
  .barre { flex: 1; height: 8px; border-radius: 4px; background: var(--nuit); overflow: hidden; }
  .barre i { display: block; height: 100%; border-radius: 4px; background: var(--jaune); }
  .progres span { font-size: 12px; color: var(--brume); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pied { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; padding-bottom: 12px; }
  .pied span { color: var(--brume); font-size: 18px; }
  .pied strong { color: var(--papier); }

  /* ——— Jeu ——— */
  #jeu {
    position: fixed; inset: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--nuit); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #scene { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 0 var(--encre); }
  #toile { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hud {
    position: absolute; background: var(--nuit); border-radius: 16px; padding: 10px 14px;
    pointer-events: none; font-size: clamp(12px, 1.4vw, 17px);
  }
  #hudTerrain { left: 12px; top: 12px; min-width: 170px; display: flex; flex-direction: column; gap: 6px; }
  #hudTerrain .ligne { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #pct { font-family: var(--titre); font-size: clamp(20px, 2.6vw, 32px); color: var(--jaune); font-variant-numeric: tabular-nums; }
  #pctBarre { height: 10px; border-radius: 5px; background: var(--nuit3); overflow: hidden; }
  #pctBarre i { display: block; height: 100%; width: 0; background: var(--jaune); border-radius: 5px; transition: width .3s; }
  #hudRang { right: 12px; top: 12px; min-width: 170px; display: flex; flex-direction: column; gap: 5px; }
  #rang { display: flex; flex-direction: column; gap: 4px; }
  #rang div { display: flex; align-items: center; gap: 8px; }
  #rang .pt { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  #rang .n { flex: 1; }
  #rang .moi { font-weight: 600; }
  #rang .efface { opacity: .45; text-decoration: line-through; }
  #rang .v { font-variant-numeric: tabular-nums; }
  #astuce {
    left: 50%; bottom: 14px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
    text-align: center; transition: opacity .8s;
  }
  .commandes { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 8px; }
  .commandes button {
    height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: var(--nuit);
    color: var(--papier); font-size: 15px; font-weight: 500; cursor: pointer;
  }
  #annonce {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: var(--titre); font-size: clamp(40px, 8vw, 90px); color: var(--papier);
    text-shadow: 5px 5px 0 var(--encre); pointer-events: none; white-space: nowrap;
  }
  #toast {
    position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
    background: var(--nuit); border: 3px solid var(--menthe); border-radius: 18px; padding: 8px 16px;
    font-weight: 600; pointer-events: none; transition: opacity .4s; white-space: nowrap;
  }

  /* ——— Fin de partie ——— */
  #fin {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow-y: auto;
  }
  .panneau {
    width: min(620px, 100%); padding: 32px 36px; border-radius: 36px; background: var(--nuit);
    box-shadow: 0 10px 0 var(--encre); display: flex; flex-direction: column; align-items: center;
    gap: 16px; text-align: center; margin: auto;
  }
  .panneau h2 { margin: 0; font-family: var(--titre); font-weight: 400; font-size: clamp(34px, 6vw, 54px); line-height: 1; color: var(--jaune); }
  .panneau h2.perdu { color: var(--tomate); }
  .panneau > p { margin: 0; font-size: 19px; color: var(--brume); }
  .chiffres { display: flex; gap: 36px; justify-content: center; flex-wrap: wrap; }
  .chiffres div { display: flex; flex-direction: column; gap: 2px; }
  .chiffres b { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .debloque {
    width: 100%; display: flex; align-items: center; gap: 16px; padding: 12px 16px; text-align: left;
    border-radius: 22px; background: var(--nuit3); border: 3px solid var(--menthe);
  }
  .debloque .etiquette { color: var(--menthe); font-weight: 600; }
  .debloque strong { display: block; font-size: 19px; }
  .debloque small { color: var(--brume); font-size: 15px; }
  .debloque.groupe { flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .tuiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; }
  .tuiles div { display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: 600; }
  #compte { font-size: 15px; color: var(--brume); }

  @media (max-width: 640px) {
    #hudRang { display: none; }
    .commandes { top: auto; bottom: 12px; }
    #astuce { display: none; }
    .panneau { padding: 24px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, #pctBarre i, #astuce, #toast { transition: none; }
  }
</style>
</head>
<body>

<!-- ——— Accueil ——— -->
<main id="accueil" class="ecran">
  <div class="tache" aria-hidden="true" style="left:-120px;top:-90px;width:420px;height:340px;background:#FF5A4E;border-radius:58% 42% 63% 37% / 45% 58% 42% 55%;opacity:.9"></div>
  <div class="tache" aria-hidden="true" style="right:-80px;bottom:-110px;width:460px;height:380px;background:#2EC4F1;border-radius:40% 60% 35% 65% / 60% 40% 60% 40%;opacity:.9"></div>
  <div class="tache" aria-hidden="true" style="right:12%;top:70px;width:120px;height:100px;background:#3DDC97;border-radius:50% 50% 45% 55% / 60% 45% 55% 40%"></div>
  <div class="tache" aria-hidden="true" style="left:13%;bottom:90px;width:70px;height:60px;background:#FFD23F;border-radius:50%"></div>

  <h1>Painting<br>Further Away</h1>
  <p id="quiJoue"></p>
  <div class="avatar-accueil">
    <canvas id="avatarAccueil" width="240" height="280" aria-hidden="true"></canvas>
    <div id="nomAccueil"></div>
  </div>
  <div class="boutons">
    <button class="btn clair" type="button" id="btnAvatar">Changer d'avatar</button>
    <button class="btn rouge" type="button" id="btnJouer">Lancer une partie</button>
  </div>
  <a class="retour-mesjeux" href="https://pierreflory-web.github.io/jeux/">← Retour à Mes Jeux</a>
</main>

<!-- ——— Choix de l'avatar ——— -->
<main id="avatars" class="ecran" hidden>
  <div class="entete">
    <button class="btn contour" type="button" id="btnRetourAv">← Retour</button>
    <h1>Choisis ta peinture</h1>
    <div class="compteur"><b id="compteur">0 / 0</b><span>débloqués</span></div>
  </div>
  <div class="onglets" id="onglets"></div>
  <div id="grille"></div>
  <div class="pied">
    <span>Avatar choisi&nbsp;: <strong id="nomChoisi"></strong></span>
    <button class="btn rouge" type="button" id="btnValider">Valider cet avatar</button>
  </div>
</main>

<!-- ——— Partie ——— -->
<div id="jeu" hidden>
  <div id="scene">
    <canvas id="toile" aria-label="Terrain de jeu : déplace la souris pour diriger ta tache"></canvas>
    <div class="hud" id="hudTerrain">
      <div class="ligne"><span class="etiquette">Ton terrain</span><span id="pct">0 %</span></div>
      <div id="pctBarre"><i></i></div>
    </div>
    <div class="hud" id="hudRang"><span class="etiquette">Classement</span><div id="rang"></div></div>
    <div class="commandes">
      <button type="button" id="btnSon" aria-pressed="true">🔊 Son</button>
      <button type="button" id="btnQuitter">✕ Quitter</button>
    </div>
    <div class="hud" id="astuce">🖱️ Ton avatar va là où tu mets la souris. Fais une boucle et reviens chez toi&nbsp;: l'intérieur devient à toi. Ne repasse jamais sur ta trace&nbsp;!</div>
    <div id="annonce" hidden></div>
    <div id="toast" hidden></div>
    <div id="fin" hidden></div>
  </div>
</div>

<script src="https://pierreflory-web.github.io/jeux/points.js"></script>
<script>
(function () {
  'use strict';

  // ——— Terrain ———
  var COLS = 100, ROWS = 60, CELL = 12, W = COLS * CELL, H = ROWS * CELL, N = COLS * ROWS;
  var NEUTRE = '#F1EEFA';
  var VICTOIRE = 0.95; // à 95 %, le dernier coup de pinceau repeint tout le reste

  var joueur = window.MesJeux ? MesJeux.session() : null;
  var PID = joueur ? joueur.id : 'local';
  var CLE_STATS = 'painting_stats_' + PID, CLE_AVATAR = 'painting_avatar_' + PID;
  function lire(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function ecrire(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ——— Motifs de peinture (tuiles dessinées pixel par pixel, répétées sans couture) ———
  var rgbCache = {};
  function rgb(h) {
    if (rgbCache[h]) return rgbCache[h];
    var n = parseInt(h.slice(1), 16);
    return (rgbCache[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]);
  }
  // les tuiles sont calculées en haute définition (×4) avec un léger lissage, puis réduites à l'affichage
  var HD = 4;
  function tuile(w, h, fn) {
    var c = document.createElement('canvas'); c.width = w * HD; c.height = h * HD;
    var x = c.getContext('2d'), img = x.createImageData(w * HD, h * HD), d = img.data;
    var off = [[.25, .25], [.75, .25], [.25, .75], [.75, .75]];
    for (var j = 0; j < h * HD; j++) for (var i = 0; i < w * HD; i++) {
      var r = 0, g = 0, b = 0;
      for (var s = 0; s < 4; s++) { var col = rgb(fn((i + off[s][0]) / HD, (j + off[s][1]) / HD)); r += col[0]; g += col[1]; b += col[2]; }
      var k = (j * w * HD + i) * 4;
      d[k] = r / 4; d[k + 1] = g / 4; d[k + 2] = b / 4; d[k + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  }
  function uni(c) { return function () { return tuile(4, 4, function () { return c; }); }; }
  function taches(bg, c, p, liste) {
    return function () {
      return tuile(p, p, function (x, y) {
        for (var n = 0; n < liste.length; n++) {
          var t = liste[n];
          for (var ox = -p; ox <= p; ox += p) for (var oy = -p; oy <= p; oy += p)
            if (Math.hypot(x - t[0] - ox, y - t[1] - oy) < t[2]) return t[3] || c;
        }
        return bg;
      });
    };
  }
  function pois(bg, c, p, r) { return taches(bg, c, p, [[p / 2, p / 2, r]]); }
  function bandesH(liste) {
    return function () {
      var h = liste.reduce(function (a, b) { return a + b[1]; }, 0);
      return tuile(4, h, function (x, y) { var s = 0; for (var i = 0; i < liste.length; i++) { s += liste[i][1]; if (y < s) return liste[i][0]; } return liste[0][0]; });
    };
  }
  function bandesV(liste) {
    return function () {
      var w = liste.reduce(function (a, b) { return a + b[1]; }, 0);
      return tuile(w, 4, function (x) { var s = 0; for (var i = 0; i < liste.length; i++) { s += liste[i][1]; if (x < s) return liste[i][0]; } return liste[0][0]; });
    };
  }
  function diag(p, l, bg, c, anti) {
    return function () {
      return tuile(p, p, function (x, y) { var v = anti ? (((Math.floor(x) - Math.floor(y)) % p) + p) % p : (Math.floor(x) + Math.floor(y)) % p; return v < l ? c : bg; });
    };
  }
  function damier(s, a, b) {
    return function () { return tuile(2 * s, 2 * s, function (x, y) { return ((Math.floor(x / s) + Math.floor(y / s)) % 2) ? b : a; }); };
  }
  var fromage = taches('#FFD23F', '#E3A400', 36, [[8, 9, 5], [25, 21, 7], [12, 28, 3.5], [30, 5, 3]]);
  function feuilles() {
    return tuile(24, 24, function (x, y) {
      var centres = [[6, 6, 1], [18, 18, -1]];
      for (var n = 0; n < centres.length; n++) {
        var dx = x - centres[n][0], dy = y - centres[n][1], sg = centres[n][2];
        var u = (dx + sg * dy) / Math.SQRT2, v = (dx - sg * dy) / Math.SQRT2;
        if ((u / 5.2) * (u / 5.2) + (v / 2.4) * (v / 2.4) < 1) return Math.abs(v) < .6 ? '#2E8B3A' : '#8EE07A';
      }
      return '#3BAA4A';
    });
  }

  // ——— Les avatars ———
  // ear : couleur des oreilles · extra : détail dessiné · motif : peinture de la zone · trace : peinture de la trace (sinon le motif)
  // mission : [texte, statistique, objectif, unité]
  var AV = [
    { id: 'tomate', cat: 'couleurs', nom: 'Tomate', c: '#FF5A4E', motif: uni('#FF5A4E') },
    { id: 'lagon', cat: 'couleurs', nom: 'Lagon', c: '#2EC4F1', motif: uni('#2EC4F1') },
    { id: 'menthe', cat: 'couleurs', nom: 'Menthe', c: '#3DDC97', motif: uni('#3DDC97') },
    { id: 'citron', cat: 'couleurs', nom: 'Citron à pois', c: '#FFD23F', motif: pois('#FFD23F', '#E8B400', 24, 5.5) },
    { id: 'damier', cat: 'couleurs', nom: 'Damier', c: '#8E5CF7', motif: damier(13, '#8E5CF7', '#6A3BD6') },
    { id: 'arcenciel', cat: 'couleurs', nom: 'Arc-en-ciel', c: '#FF8A1F', motif: bandesH([['#FF5A4E', 8], ['#FF8A1F', 8], ['#FFD23F', 8], ['#3DDC97', 8], ['#2EC4F1', 8], ['#8E5CF7', 8]]), mission: ['Gagne 10 parties', 'wins', 10] },

    { id: 'tigre', cat: 'animaux', nom: 'Tigre', c: '#FF8A1F', ear: '#FF8A1F', motif: diag(16, 4, '#FF8A1F', '#0E1128'), mission: ['Gagne ta première partie', 'wins', 1] },
    { id: 'zebre', cat: 'animaux', nom: 'Zèbre', c: '#F4F1FF', ear: '#F4F1FF', motif: diag(22, 11, '#F4F1FF', '#0E1128', true), mission: ['Prends 20 % du terrain en une seule boucle', 'maxLoop', 20, ' %'] },

    if (G.me.alive && G.souris && !G.fini) {
      ctx.save();
      ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(14,17,40,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(G.me.x, G.me.y); ctx.lineTo(G.souris.x, G.souris.y); ctx.stroke();
      ctx.restore();
    }
    // les têtes
    for (n = G.ents.length - 1; n >= 0; n--) {
      e = G.ents[n];
      if (!e.alive) continue;
      if (!e.bot) {
        // un halo blanc pour toujours voir ta tache, même sur ta propre peinture
        ctx.beginPath(); ctx.arc(e.x, e.y, 23, 0, Math.PI * 2); ctx.fillStyle = 'rgba(244,241,255,.85)'; ctx.fill();
      }
      dessinerAvatar(ctx, e.av, e.x, e.y, e.bot ? 15 : 17, { anneau: '#1B1F3B', echelle: .8, regard: e.ang, content: G.fini && !e.bot });
      if (e.bot) {
        ctx.font = '600 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(244,241,255,.9)'; ctx.strokeText(e.nom, e.x, e.y - 28);
        ctx.fillStyle = '#1B1F3B'; ctx.fillText(e.nom, e.x, e.y - 28);
      }
    }
    // éclaboussures
    for (var p = 0; p < G.parts.length; p++) {
      var q = G.parts[p];
      ctx.globalAlpha = Math.max(0, Math.min(1, q.vie * 2));
      ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function majHud() {
    var pc = G.me.count / N * 100;
    G.maxPct = Math.max(G.maxPct, pc);
    var txt = (pc >= 99.95 ? 100 : pc < 10 ? pc.toFixed(1).replace('.', ',') : Math.floor(pc)) + ' %';
    $('pct').textContent = txt;
    $('pctBarre').firstChild.style.width = Math.min(100, pc / VICTOIRE) + '%';
    var tri = G.ents.slice().sort(function (a, b) { return (b.alive - a.alive) || (b.count - a.count); });
    var r = $('rang'); r.innerHTML = '';
    tri.forEach(function (e) {
      var d = document.createElement('div');
      if (!e.bot) d.className = 'moi';
      if (!e.alive) d.className += ' efface';
      d.innerHTML = '<span class="pt"></span><span class="n"></span><span class="v"></span>';
      d.querySelector('.pt').style.background = e.av.c;
      d.querySelector('.n').textContent = e.bot ? e.nom : 'Toi';
      d.querySelector('.v').textContent = e.alive ? Math.floor(e.count / N * 100) + ' %' : 'effacé';
      r.appendChild(d);
    });
  }

  // ——— Fin de partie ———
  function aujourdhui() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  var minuteurRetour = 0;

  function finPartie(gagne, tueur, recouvert, propre) {
    if (G.fini) return;
    G.fini = true;
    $('astuce').style.opacity = 0;
    var secs = Math.max(1, Math.round(G.t));
    var avant = listeDebloques();
    var av = G.me.av;
    // les statistiques qui débloquent les avatars
    stats.games++;
    if (stats.days.indexOf(aujourdhui()) === -1) stats.days.push(aujourdhui());
    if (av.cat === 'animaux') stats.animalGames++;
    if (av.cat === 'aliments') stats.foodGames++;
    stats.dist += G.dist; stats.kills += G.kills; stats.maxKills = Math.max(stats.maxKills, G.kills);
    stats.maxPct = Math.max(stats.maxPct, gagne ? 100 : G.maxPct);
    stats.maxLoop = Math.max(stats.maxLoop, G.maxLoop);
    stats.stolen += G.stolen / N * 100; stats.loops += G.loops;
    if (G.quick) stats.quick = 1;
    if (gagne) {
      stats.wins++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
      stats.bestTime = stats.bestTime ? Math.min(stats.bestTime, secs) : secs;
      if (stats.winAv.indexOf(av.id) === -1) stats.winAv.push(av.id);
    } else { stats.losses++; stats.streak = 0; }
    ecrire(CLE_STATS, stats);
    var nouveaux = listeDebloques().filter(function (id) { return avant.indexOf(id) === -1; }).map(avatarParId);

    var duree = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    var f = $('fin');
    var pan = document.createElement('div'); pan.className = 'panneau';
    var cv = document.createElement('canvas'); cv.width = 130; cv.height = 150; cv.setAttribute('aria-hidden', 'true');
    pan.appendChild(cv);
    var h = document.createElement('h2'), p = document.createElement('p');
    if (gagne) {
      h.textContent = 'Terrain conquis\u00a0!';
      p.textContent = av.nom + ' a repeint 100 % du terrain. 🎉';
    } else {
      h.textContent = recouvert ? 'Ta tache a disparu\u00a0!' : 'Ta trace a été coupée\u00a0!';
      h.className = 'perdu';
      p.textContent = propre ? 'Tu es passé sur ta propre trace.' : tueur
        ? (recouvert ? tueur.av.nom + ' a recouvert toute ta peinture.' : tueur.av.nom + ' est passé sur ta trace.')
        : 'Ta peinture a été effacée.';
    }
    pan.appendChild(h); pan.appendChild(p);
    var ch = document.createElement('div'); ch.className = 'chiffres';
    function chiffre(v, l) { var d = document.createElement('div'); d.innerHTML = '<b></b><span class="etiquette"></span>'; d.querySelector('b').textContent = v; d.querySelector('span').textContent = l; ch.appendChild(d); }
    chiffre(duree, 'Durée');
    if (!gagne) chiffre(Math.floor(G.maxPct) + ' %', 'Ton record ici');
    chiffre(G.kills, G.kills > 1 ? 'Adversaires effacés' : 'Adversaire effacé');
    pan.appendChild(ch);
    if (nouveaux.length > 1) {
      var grp = document.createElement('div'); grp.className = 'debloque groupe';
      var tt = document.createElement('span'); tt.className = 'etiquette'; tt.textContent = nouveaux.length + ' missions accomplies ✨';
      grp.appendChild(tt);
      var rang = document.createElement('div'); rang.className = 'tuiles';
      nouveaux.forEach(function (a) {
        var tu = document.createElement('div'); tu.title = 'Mission : ' + a.mission[0];
        var mc = document.createElement('canvas'); mc.width = 60; mc.height = 64; mc.setAttribute('aria-hidden', 'true');
        var nm = document.createElement('span'); nm.textContent = a.nom;
        tu.appendChild(mc); tu.appendChild(nm); rang.appendChild(tu);
        setTimeout(function () { toileAvatar(mc, a, 20); }, 0);
      });
      grp.appendChild(rang);
      pan.appendChild(grp);
    }
    if (nouveaux.length === 1) nouveaux.forEach(function (a) {
      var d = document.createElement('div'); d.className = 'debloque';
      var mini = document.createElement('canvas'); mini.width = 70; mini.height = 84; mini.setAttribute('aria-hidden', 'true');
      d.appendChild(mini);
      var t = document.createElement('div');
      t.innerHTML = '<span class="etiquette">Mission accomplie</span><strong></strong><small></small>';
      t.querySelector('strong').textContent = a.nom + ' débloqué\u00a0! ✨';
      t.querySelector('small').textContent = 'Mission : ' + a.mission[0].charAt(0).toLowerCase() + a.mission[0].slice(1);
      d.appendChild(t);
      pan.appendChild(d);
      setTimeout(function () { toileAvatar(mini, a, 24); }, 0);
    });
    var bt = document.createElement('div'); bt.className = 'boutons';
    var b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'btn clair';
    var b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn rouge';
    if (gagne) {
      b1.textContent = 'Voir mes avatars'; b1.onclick = function () { clearInterval(minuteurRetour); afficherAvatars(); };
      b2.textContent = 'Retour à l’accueil'; b2.onclick = function () { clearInterval(minuteurRetour); afficherAccueil(); };
    } else {
      b1.textContent = 'Accueil'; b1.onclick = afficherAccueil;
      b2.textContent = 'Rejouer'; b2.onclick = function () { lancerPartie(); };
    }
    bt.appendChild(b1); bt.appendChild(b2); pan.appendChild(bt);
    f.innerHTML = ''; f.appendChild(pan);
    toileAvatar(cv, av, 46, { content: gagne });

    setTimeout(function () { f.hidden = false; b2.focus({ preventScroll: true }); }, gagne ? 700 : 900);

    if (gagne) {
      var reste = nouveaux.length ? 8 : 5;
      var compte = document.createElement('span'); compte.id = 'compte';
      compte.textContent = 'Retour automatique à l’accueil dans ' + reste + ' s';
      pan.appendChild(compte);
      clearInterval(minuteurRetour);
      setTimeout(function () {
        minuteurRetour = setInterval(function () {
          reste--;
          compte.textContent = 'Retour automatique à l’accueil dans ' + reste + ' s';
          if (reste <= 0) { clearInterval(minuteurRetour); if (!$('jeu').hidden) afficherAccueil(); }
        }, 1000);
      }, 700);
      // points et pièces du lanceur Mes Jeux
      if (window.MesJeux) {
        var lignes = [[30, 'Terrain entièrement repeint']];
        if (G.kills) lignes.push([G.kills * 5, G.kills + ' adversaire' + (G.kills > 1 ? 's effacés' : ' effacé')]);
        if (secs < 120) lignes.push([10, 'Victoire en moins de 2 minutes']);
        try { MesJeux.award('painting', lignes, { secs: secs, score: 100 }); } catch (e) {}
      }
    }
  }

  // ——— Démarrage ———
  afficherAccueil();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!$('accueil').hidden) afficherAccueil(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
