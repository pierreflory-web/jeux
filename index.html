<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Jeux</title>
<meta name="description" content="Lanceur de jeux">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Jeux">
<meta name="theme-color" content="#2a1445">
<style>
  :root {
    --bg: #2a1445;
    --bg-card: #331d5c;
    --bg-card-hover: #3c2469;
    --border: #5a3d94;
    --gold: #ffd27a;
    --cream: #f0eaff;
    --muted: #c9b3e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 30% 22%, rgba(255, 79, 216, 0.22) 0%, transparent 42%),
      radial-gradient(circle at 82% 72%, rgba(61, 225, 232, 0.14) 0%, transparent 45%),
      linear-gradient(135deg, #2a1445 0%, #4b2a8c 62%, #6d3aa0 100%);
    background-attachment: fixed;
    color: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.6px 1.6px at 22px 34px, #ffffff, transparent),
      radial-gradient(1.3px 1.3px at 120px 90px, #ffffffcc, transparent),
      radial-gradient(1.8px 1.8px at 200px 22px, #ffffff, transparent),
      radial-gradient(1.2px 1.2px at 260px 140px, #ffffffbb, transparent),
      radial-gradient(1.5px 1.5px at 66px 190px, #ffffffdd, transparent),
      radial-gradient(1.2px 1.2px at 170px 230px, #ffffffaa, transparent),
      radial-gradient(1.7px 1.7px at 240px 260px, #ffffff, transparent);
    background-repeat: repeat;
    background-size: 280px 290px;
    opacity: .8;
  }
  header {
    text-align: center;
    margin: 28px 0 36px;
  }
  .stars {
    display: block;
    margin-bottom: 10px;
    letter-spacing: 12px;
  }
  .stars span { font-size: 26px; vertical-align: middle; }
  .stars span:nth-child(2) { font-size: 38px; }
  h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  header p {
    margin: 10px 0 0;
    color: var(--muted);
    font-style: italic;
    font-size: 15px;
  }
  .rule {
    width: 160px;
    border: 0;
    border-top: 1px solid var(--border);
    margin: 18px auto 0;
    position: relative;
  }
  main {
    width: 100%;
    max-width: 460px;
    display: grid;
    gap: 18px;
  }
  .game {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    transition: background .15s ease, transform .1s ease;
  }
  .game:active { transform: scale(.98); background: var(--bg-card-hover); }
  @media (hover: hover) {
    .game:hover { background: var(--bg-card-hover); }
  }
  .game .icon {
    width: 58px;
    height: 58px;
    border-radius: 13px;
    border: 1px solid var(--border);
    float: left;
    margin: 2px 18px 6px 0;
    object-fit: cover;
    background: var(--bg);
  }
  .game h2 {
    margin: 0 0 6px;
    font-size: 20px;
    color: var(--gold);
    font-weight: 600;
  }
  .game p {
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.45;
  }
  .game .tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--gold);
    border-radius: 4px;
    padding: 3px 9px;
    font-family: -apple-system, sans-serif;
    font-weight: 700;
  }
  footer {
    margin-top: auto;
    padding-top: 40px;
    color: #8a76b8;
    font-size: 12px;
    font-style: italic;
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <span class="stars"><span>⭐️</span><span>⭐️</span><span>⭐️</span></span>
    <h1>Mes Jeux</h1>
    <p>Choisissez votre partie, étranger…</p>
    <hr class="rule">
  </header>

  <main id="games"></main>

  <footer>Bonne partie à toi</footer>

<script>
  // Pour ajouter un jeu : ajouter une entrée à cette liste.
  const GAMES = [
    {
      title: "La Traque de Mac Blain",
      icon: "https://pierreflory-web.github.io/cowboy-city/icons/icon-192.png",
      tag: "Western",
      description: "Poussière, saloons et hors-la-loi : retrouvez Mac Blain avant qu'il ne quitte la ville.",
      url: "https://pierreflory-web.github.io/cowboy-city/"
    },
    {
      title: "Quest — L'enquête",
      icon: "https://pierreflory-web.github.io/quest/icons/icon-192.png",
      tag: "Enquête",
      description: "Interrogez, déduisez, accusez : une enquête où chaque détail compte.",
      url: "https://pierreflory-web.github.io/quest/"
    }
  ];

  document.getElementById("games").innerHTML = GAMES.map(g => `
    <a class="game" href="${g.url}">
      <img class="icon" src="${g.icon}" alt="">
      <h2>${g.title}</h2>
      <p>${g.description}</p>
      <span class="tag">${g.tag}</span>
    </a>`).join("");
</script>
</body>
</html>
