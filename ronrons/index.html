<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ronron Café</title>
<link rel="icon" href="icon.svg">
<!-- Polices : chargées si le lanceur a internet, sinon repli automatique sur les polices système -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EEDF; --paper:#FBF5EA; --ink:#4A3326; --ink2:#6B5444; --wood:#8A5A3B; --wood2:#A97C5A;
    --terra:#D9826B; --terra-d:#B76A55; --sage:#4F6B4A; --sage-d:#3B5237; --sage-l:#8FAF8A;
    --butter:#F2C46D; --rose:#E9A9B0; --sky:#CFE3E6; --line:#D8C7A8; --ok:#3E5A39; --bad:#A3402C;
    --font-title: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;position:fixed;inset:0;overflow:hidden;background:#2E2420;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font-body);color:var(--ink)}
  #stage{width:1280px;height:720px;position:fixed;left:50%;top:50%;overflow:hidden;background:var(--cream);transform-origin:center center;border-radius:6px}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed}
  h1,h2,h3{font-family:var(--font-title);margin:0;font-weight:600}
  .pill{display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border-radius:999px;background:var(--cream);box-shadow:0 4px 0 var(--line);font-family:var(--font-title);font-weight:600;font-size:18px}
  .pill.dark{background:var(--ink);color:var(--cream);box-shadow:none}
  .panel{background:var(--paper);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:18px}
  .btn{border:0;border-radius:16px;padding:14px 20px;font-family:var(--font-title);font-weight:600;font-size:18px;background:var(--terra);color:#fff;box-shadow:0 5px 0 var(--terra-d);transition:transform .08s}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--terra-d)}
  .btn.green{background:var(--sage);box-shadow:0 5px 0 var(--sage-d)}
  .btn.light{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--line)}
  .btn:disabled{background:var(--line);color:var(--ink2);box-shadow:none}
  .btn.small{padding:8px 12px;font-size:15px;border-radius:12px}
  .hud{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
  .hud > div{display:flex;gap:10px;pointer-events:auto}
  .coin{width:20px;height:20px;border-radius:50%;background:var(--butter);box-shadow:inset 0 0 0 3px #C99A3E}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #C9B48E;flex-shrink:0}
  .toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:999px;font-weight:800;z-index:50;animation:pop .25s ease-out}
  @keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes fallRain{to{transform:translate(-40px,var(--h)) rotate(12deg)}}
  @keyframes fallSnow{50%{margin-left:14px}to{transform:translateY(var(--h))}}
  @keyframes squish{0%{transform:scale(1,1)}40%{transform:scale(1.08,.9)}100%{transform:scale(1,1)}}
  .squish{animation:squish .22s ease-out}
  @keyframes steam{0%{opacity:0;transform:translateY(0)}50%{opacity:.8}100%{opacity:0;transform:translateY(-24px)}}
  .grid{display:grid;gap:12px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
  .tag{padding:3px 8px;border-radius:999px;background:#E9F0E4;color:var(--ok);font-size:11px;font-weight:800}
  .muted{color:var(--ink2)}
  .row{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center}
  .bar{height:8px;border-radius:4px;background:#EADBB8;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:4px}
  .hot{position:absolute;border:0;border-radius:12px;background:var(--cream);box-shadow:0 3px 0 var(--line);padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .hot b{font-family:var(--font-title);font-weight:600;font-size:16px}
  .hot small{font-size:12px;font-weight:700;color:var(--ok)}
  .hot.main{background:var(--terra);color:#fff;box-shadow:0 4px 0 var(--terra-d)}
  .hot.main small{color:#fff}
  .modal-bg{position:absolute;inset:0;background:rgba(46,36,32,.45);display:flex;align-items:center;justify-content:center;z-index:40}
  .modal{width:560px;max-height:620px;overflow:auto}
  .catsvg{animation:bob 3s ease-in-out infinite}
  :focus-visible{outline:3px solid var(--sage);outline-offset:2px}
</style>
</head>

    const x = (i * 97.3) % w, d = (i * 0.37) % (snow ? 6 : 1.2), dur = snow ? 5 + (i % 5) : 0.7 + (i % 4) * 0.12;

const SND = { ctx: null, master: null, music: null, sfx: null, delay: null, on: true, timer: null, next: 0, beat: 0 };
try { SND.on = localStorage.getItem("ronrons-sound") !== "off"; } catch (e) {}
function audioInit() {
  if (SND.ctx || !(window.AudioContext || window.webkitAudioContext)) { if (SND.ctx && SND.ctx.state === "suspended") SND.ctx.resume(); return; }

  SND.music = ctx.createGain(); SND.music.gain.value = 0.22;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200; lp.Q.value = 0.4;
  SND.music.connect(lp); lp.connect(SND.master);
  SND.sfx = ctx.createGain(); SND.sfx.gain.value = 0.5; SND.sfx.connect(SND.master);
  // petit écho doux pour la musique
  SND.delay = ctx.createDelay(); SND.delay.delayTime.value = 0.5625; // une croche pointée à 80 bpm
  const fb = ctx.createGain(); fb.gain.value = 0.28; const wet = ctx.createGain(); wet.gain.value = 0.35;
  SND.delay.connect(fb); fb.connect(SND.delay); SND.delay.connect(wet); wet.connect(SND.music);
  SND.next = ctx.currentTime + 0.1;

}
function toggleSound() {
  SND.on = !SND.on;

  if (SND.master) SND.master.gain.setTargetAtTime(SND.on ? 0.7 : 0, SND.ctx.currentTime, 0.1);
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);

}

  const ctx = SND.ctx, len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.start(t); src.stop(t + dur);

function sfx(name) {
  if (!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime;
  switch (name) {
    case "click": tone(740, t, 0.06, { vol: 0.12 }); break;
    case "pop": tone(380, t, 0.12, { vol: 0.25, glide: 900 }); break;
    case "knead": tone(140, t, 0.15, { vol: 0.35, type: "triangle", glide: 90 }); break;
    case "swish": noise(t, 0.12, { freq: 1800, q: 0.8, vol: 0.08 }); break;
    case "step": [72, 76].forEach((m, i) => tone(mtof(m), t + i * 0.08, 0.25, { type: "triangle", vol: 0.18 })); break;
    case "done": [72, 76, 79, 84].forEach((m, i) => tone(mtof(m), t + i * 0.1, 0.5, { type: "triangle", vol: 0.2 })); break;
    case "coin": tone(988, t, 0.12, { type: "square", vol: 0.06 }); tone(1319, t + 0.08, 0.3, { type: "square", vol: 0.06 }); break;
    case "bell": [1568, 2093].forEach((f, i) => tone(f, t + i * 0.12, 1.1, { vol: 0.12 })); break;
    case "ding": tone(1760, t, 1.2, { vol: 0.16 }); tone(2637, t, 0.8, { vol: 0.05 }); break;
    case "oven": noise(t, 0.5, { freq: 300, q: 0.5, vol: 0.12, type: "lowpass" }); break;
    case "bark": [0, 0.22].forEach((d) => { tone(330, t + d, 0.12, { type: "square", vol: 0.05, glide: 210 }); noise(t + d, 0.1, { freq: 700, q: 1.2, vol: 0.12 }); }); break;
    case "purr": noise(t, 1.2, { freq: 220, q: 0.7, vol: 0.35, type: "lowpass", lfo: 24 }); break;
    case "heart": [79, 83, 86].forEach((m, i) => tone(mtof(m), t + i * 0.09, 0.45, { vol: 0.14 })); break;
    case "page": noise(t, 0.18, { freq: 3000, q: 0.6, vol: 0.06 }); break;
  }
}
// Musique : une petite valse lo-fi composée (16 mesures en fa majeur, 80 bpm),
// piano électrique, basse ronde, boîte à musique et percussions feutrées.
const EIGHTH = 0.375;
const PROG = [
  { v: [53, 57, 60, 64], b: 41 }, { v: [52, 57, 60, 64], b: 45 }, { v: [50, 57, 60, 65], b: 38 }, { v: [50, 53, 57, 62], b: 46 },
  { v: [55, 58, 62, 65], b: 43 }, { v: [52, 55, 58, 64], b: 36 }, { v: [53, 57, 60, 64], b: 41 }, { v: [52, 55, 58, 64], b: 36 },

const MELODY = [ // [note MIDI ou null, durée en croches] — 8 croches par mesure
  [[69,2],[72,2],[76,3],[74,1]], [[72,2],[69,2],[67,2],[69,2]], [[65,2],[69,2],[74,3],[72,1]], [[70,4],[69,2],[67,2]],
  [[67,2],[70,2],[74,2],[72,2]], [[70,2],[69,2],[67,4]], [[69,2],[72,2],[77,3],[76,1]], [[74,2],[72,2],[null,4]],
  [[77,3],[76,1],[74,2],[72,2]], [[76,2],[72,2],[69,4]], [[74,3],[72,1],[69,2],[65,2]], [[67,2],[69,2],[70,4]],
  [[70,2],[74,2],[77,2],[76,2]], [[74,2],[72,2],[70,2],[67,2]], [[69,4],[72,2],[69,2]], [[65,6],[null,2]],

const MEL_AT = MELODY.map((bar) => { const m = {}; let e = 0; bar.forEach(([n, d]) => { if (n) m[e] = [n, d]; e += d; }); return m; });
function ePiano(m, t, dur, vol) {
  const f = mtof(m);

}
function musicBox(m, t, dur, vol) {
  const f = mtof(m);
  const g1 = tone(f, t, Math.max(0.9, dur), { type: "sine", vol, attack: 0.005, out: SND.music });

function scheduleMusic() {

    const t = SND.next, e = SND.beat % 128, loop = Math.floor(SND.beat / 128);

    // piano électrique : temps 1 et contretemps du 3
    if (pos === 0) ch.v.forEach((m, i) => ePiano(m, t + i * 0.012, EIGHTH * 5, 0.045));

    if (pos === 4) tone(mtof(ch.b + 7), t, EIGHTH * 3.2, { type: "triangle", vol: 0.12, attack: 0.02, out: SND.music });
    // percussions feutrées
    if (pos === 0 || pos === 4) tone(80, t, 0.16, { type: "sine", vol: 0.22, attack: 0.003, glide: 42, out: SND.music });
    if (pos === 2 || pos === 6) noise(t, 0.09, { freq: 2200, q: 0.7, vol: 0.035, out: SND.music });
    if (pos % 2) noise(t + swing, 0.04, { freq: 7000, q: 0.9, vol: 0.018, type: "highpass", out: SND.music });
    // boîte à musique (une boucle sur trois : seulement les accords, pour respirer)
    if (loop % 3 !== 2) {
      const n = MEL_AT[bar][pos];
      if (n) {
        musicBox(n[0], t + swing, n[1] * EIGHTH, 0.11);
        if (S && S.decor && S.decor.includes("gramophone")) tone(mtof(n[0] - 12), t + swing, n[1] * EIGHTH, { type: "triangle", vol: 0.04, attack: 0.03, out: SND.music });
      }
    } else if (pos === 0 || pos === 3 || pos === 6) {
      musicBox(ch.v[(pos / 3) % 4] + 12, t, 0.9, 0.06); // arpège doux
    }
    SND.next += EIGHTH; SND.beat++;
  }
}

function mapAside() {
  return `
  <aside class="panel" style="position:absolute;right:24px;top:18px;bottom:24px;width:290px;display:flex;flex-direction:column;gap:12px">
    <div class="between"><h2 style="font-size:21px">Garde-manger</h2>${coinPill()}</div>

      ${Object.keys(ITEMS).filter((k) => qty(k) > 0).map((k) => `<div class="row" style="background:#fff;border-radius:10px;padding:6px 8px;gap:6px"><span class="dot" style="background:${ITEMS[k].c}"></span><span style="flex:1">${ITEMS[k].n}</span><b>${qty(k)}</b></div>`).join("") || `<div class="muted">Vide : passe à l'épicerie !</div>`}
    </div>
    ${(() => { const ids = Object.keys(PROJECTS), doneN = ids.filter(projDone).length, nx = ids.find((id) => !projDone(id) && projOpen(id));
      return `<div style="background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px">
      <div class="between"><span style="font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ok)">${onIsland() ? "PROJETS DE L'ÎLE" : "PROJETS DU VILLAGE"}</span><span style="font-size:12px;font-weight:800">${doneN} / ${ids.length}</span></div>
      ${nx ? `<b style="font-family:var(--font-title);font-size:17px">${PROJECTS[nx].n}</b>
      <div class="bar" style="height:10px"><i style="width:${Math.min(100, (S.projects[nx] || 0) / PROJECTS[nx].goal * 100)}%;background:var(--terra)"></i></div>
      <span style="font-size:12px;font-weight:700">${S.projects[nx] || 0} / ${PROJECTS[nx].goal} pièces · ${esc(PROJECTS[nx].fx)}</span>
      <div class="row" style="gap:6px"><button class="btn small" data-a="donate" data-id="${nx}" data-amt="25" style="flex:1" ${S.coins < 25 ? "disabled" : ""}>Donner 25</button><button class="btn light small" data-a="projects" style="flex:1">Tous les projets</button></div>`
      : doneN === ids.length ? (onIsland() ? `<b style="font-family:var(--font-title);font-size:17px;color:var(--ok)">Tous les projets de l'île sont terminés !</b><button class="btn light small" data-a="projects">Voir les projets</button>`
        : `<b style="font-family:var(--font-title);font-size:17px;color:var(--ok)">Tous les projets sont terminés !</b>${loadMeta().coq ? `<button class="btn small" data-a="toisland" style="background:#5FA9B4;box-shadow:0 4px 0 #3F8F9A">Bateau pour l'île →</button>` : `<button class="btn small" data-a="depart" style="background:#5FA9B4;box-shadow:0 4px 0 #3F8F9A">Partir sur l'île aux Coquillages →</button>`}<button class="btn light small" data-a="projects">Voir les projets</button>`)
      : `<b style="font-family:var(--font-title);font-size:16px">${onIsland() ? "L'île prépare un nouveau projet…" : "Le village prépare un nouveau projet…"}</b><span class="muted" style="font-size:12px;font-weight:700">${(() => { const h = ids.find((id) => !projVisible(id)); return h ? "Il sera annoncé dans " + (projDay(h) - S.day) + " jour(s)." : ""; })()}</span><button class="btn light small" data-a="projects">Voir les projets</button>`}
    </div>`; })()}
    <div style="font-size:14px" class="muted">Animaux au café : <b style="color:var(--ink)">${S.cats.map((c) => CATS[c].n).join(", ")}</b></div>
    ${onIsland() && (S.mapPieces || 0) > 0 && !S.treasure ? `<div class="row" style="gap:8px;background:#F6E4B9;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800"><svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><rect x="1" y="1" width="24" height="18" fill="#EBD9A8" stroke="#A88A52" stroke-width="1.5"/><path d="M15 6 l5 5 M20 6 l-5 5" stroke="#E06A6A" stroke-width="2"/></svg>Bouts de carte : ${S.mapPieces} / 4</div>` : ""}
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <div class="row" style="gap:6px"><button class="btn light small" data-a="album" style="flex:1;padding:8px 4px">Animaux</button><button class="btn light small" data-a="friends" style="flex:1;padding:8px 4px">${onIsland() ? "Voisins" : "Villageois"}</button><button class="btn light small" data-a="help" style="flex:1;padding:8px 4px">Aide</button></div>

const stepKind = (label) => /^Ajouter/.test(label) ? "add" : /Pétrir/.test(label) ? "knead" : /Mélanger|Fouetter/.test(label) ? "stir" : /four/i.test(label) ? "oven" : /Chauffer|infuser|poêle|gaufrier/i.test(label) ? "wait" : "tap";
const allSteps = (r) => ["Ajouter les ingrédients", ...r.steps];
const TAPS = { knead: 8, tap: 6 };
const WAIT_SECS = { wait: 2.6, oven: 3.6 };
function unitsOf(r) { const u = []; for (const [k, v] of Object.entries(r.needs)) for (let i = 0; i < v; i++) u.push(k); return u; }
function curKind() { if (!ui.cook) return null; const r = RECIPES[ui.cook.id]; return stepKind(allSteps(r)[ui.cook.i]); }
function advanceCook() {
  const c = ui.cook, r = RECIPES[c.id];
  c.i++; c.prog = 0; c.taps = 0; c.ovenIn = false; c.stirring = false; c.ang = 0;
  if (c.i >= allSteps(r).length) {
    S.showcase[c.id] = (S.showcase[c.id] || 0) + r.yield; ui.cook = null; save();
    sfx("done"); toast(r.n + " en vitrine (+" + r.yield + ")");
  } else sfx("step");
  render();
}
let cookTimer = null, cookLast = 0;
function syncCookTimer() {
  const k = curKind();
  const need = ui.screen === "kitchen" && !ui.modal && ui.cook && (k === "wait" || (k === "oven" && ui.cook.ovenIn && ui.cook.prog < 1));
  if (need && !cookTimer) { cookLast = performance.now(); cookTimer = setInterval(cookTick, 100); }
  if (!need && cookTimer) { clearInterval(cookTimer); cookTimer = null; }
}
function cookTick() {
  const now = performance.now(), dt = (now - cookLast) / 1000; cookLast = now;
  const k = curKind(); if (!k) return syncCookTimer();
  ui.cook.prog = Math.min(1, ui.cook.prog + dt / WAIT_SECS[k]);
  const bar = document.getElementById("cookbar"); if (bar) bar.style.width = (ui.cook.prog * 100) + "%";
  if (ui.cook.prog >= 1) { if (k === "wait") advanceCook(); else { sfx("ding"); render(); } }
}
function stirMove(e) {
  const c = ui.cook; if (!c || !c.stirring) return;
  const bowl = document.getElementById("bowl"); if (!bowl) return;
  const b = bowl.getBoundingClientRect();
  const ang = Math.atan2(e.clientY - (b.top + b.height * 0.35), e.clientX - (b.left + b.width / 2));
  if (c.lastAng != null) {
    let d = ang - c.lastAng; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
    c.prog = Math.min(1, c.prog + Math.abs(d) / (Math.PI * 2 * 3)); c.ang += d * 180 / Math.PI;
    if (Math.abs(d) > 0.35) sfx("swish");
  }
  c.lastAng = ang;
  const sp = document.getElementById("spoon"); if (sp) sp.style.transform = `rotate(${c.ang}deg)`;
  const bar = document.getElementById("cookbar"); if (bar) bar.style.width = (c.prog * 100) + "%";
  if (c.prog >= 1) { c.stirring = false; advanceCook(); }
}

function startCafe() {
  S.phase = "apresmidi";
  cafe = { spawned: 0, served: 0, missed: 0, earned: 0, tips: 0, seats: [null, null, null], events: [], nextSpawn: 1 + Math.random() * 4, time: 0, petCd: {}, timer: null, last: performance.now() };

}
// ---------- Chats qui se promènent dans le café ----------
// Vitesse à laquelle les chats ont faim (points d'humeur perdus par seconde de service).
// 0,2 : un chat bien nourri tient environ une journée entière de service.
const CAT_HUNGER = 0.2;
const CAT_SPOTS = [
  { x: 372, y: 426, floor: true }, { x: 470, y: 222 }, { x: 1176, y: 112 }, { x: 560, y: 494, floor: true }, { x: 1180, y: 252 },
  { x: 780, y: 490, floor: true }, { x: 244, y: 222 }, { x: 1170, y: 392 }, { x: 1000, y: 490, floor: true }, { x: 70, y: 444, floor: true },
  { x: 272, y: 486, req: "panier", floor: true }, { x: 176, y: 440, req: "fauteuil", floor: true }, { x: 1000, y: 112, req: "aquarium" },
  { x: 440, y: 520, floor: true }, { x: 1206, y: 520, floor: true }, { x: 160, y: 520, floor: true },
  { x: 682, y: 270, req: "hamac" },
];
const nowS = () => performance.now() / 1000;
function catSpots(id) { return CAT_SPOTS.map((p, i) => ({ ...p, i })).filter((p) => (!p.req || S.decor.includes(p.req)) && (!id || !isDog(id) || p.floor)); }
const FLOOR_Y = 494; // hauteur du sol où les chats marchent
function catPos(c, t = nowS()) {
  if (!c.dur || !c.pts) return { x: c.tx, y: c.ty, moving: false, dx: 0 };
  let e = t - c.start;
  if (e >= c.dur) return { x: c.tx, y: c.ty, moving: false, dx: 0 };
  for (let i = 1; i < c.pts.length; i++) {
    const a = c.pts[i - 1], b = c.pts[i], d = c.segs[i - 1];
    if (e <= d || i === c.pts.length - 1) { const k = d ? Math.min(1, e / d) : 1; return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, moving: true, dx: b.x - a.x, seg: i, k }; }
    e -= d;
  }
}
function ensureCatPositions() {
  cafe.cp = cafe.cp || {};
  const used = new Set(Object.values(cafe.cp).map((c) => c.spot));
  // les chiens d'abord (moins de places possibles), puis les chats
  S.cats.slice().sort((a, b) => isDog(b) - isDog(a)).forEach((id) => {
    if (cafe.cp[id]) return;
    const free = catSpots(id).find((p) => !used.has(p.i)); if (!free) return;
    used.add(free.i); cafe.cp[id] = { x: free.x, y: free.y, tx: free.x, ty: free.y, start: 0, dur: 0, spot: free.i };
  });
}
function moveCats(dt) {
  cafe.moveCd = (cafe.moveCd ?? 2) - dt;
  if (cafe.moveCd > 0) return;
  cafe.moveCd = 2 + Math.random() * 3;
  const t = nowS();
  const idle = Object.keys(cafe.cp).filter((id) => (S.mood[id] ?? 60) >= 30 && !catPos(cafe.cp[id], t).moving);
  if (!idle.length) return;
  const id = idle[Math.floor(Math.random() * idle.length)], c = cafe.cp[id];
  const used = new Set(Object.values(cafe.cp).map((o) => o.spot));
  const free = catSpots(id).filter((p) => !used.has(p.i)); if (!free.length) return;
  const dest = free[Math.floor(Math.random() * free.length)];
  const cur = catPos(c, t);
  // les chats ne volent pas : ils sautent au sol, marchent, puis grimpent
  const high = (y) => y < FLOOR_Y - 60;
  const pts = [{ x: cur.x, y: cur.y }];
  if (high(cur.y)) pts.push({ x: cur.x, y: FLOOR_Y });
  if (high(dest.y)) pts.push({ x: dest.x, y: FLOOR_Y });
  pts.push({ x: dest.x, y: dest.y });
  const segs = [];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dist = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push(Math.abs(b.x - a.x) < 1 ? Math.max(0.35, dist / 420) : Math.max(0.8, dist / 120)); // saut rapide, marche tranquille
  }
  const dur = segs.reduce((a, b) => a + b, 0);
  Object.assign(c, { x: cur.x, y: cur.y, tx: dest.x, ty: dest.y, pts, segs, start: t, dur, spot: dest.i });
}
function animateCats() {
  const t = nowS();
  $stage.querySelectorAll("[data-cat]").forEach((el) => {
    const c = cafe && cafe.cp && cafe.cp[el.dataset.cat]; if (!c) return;
    const p = catPos(c, t); if (!p.moving) return;
    // le reste du chemin, joué d'un seul tenant par le navigateur
    const frames = [{ left: p.x + "px", top: p.y + "px", offset: 0 }];
    const rem = c.start + c.dur - t;
    let acc = c.segs[p.seg - 1] * (1 - p.k);
    frames.push({ left: c.pts[p.seg].x + "px", top: c.pts[p.seg].y + "px", offset: Math.min(1, acc / rem) });
    for (let i = p.seg + 1; i < c.pts.length; i++) { acc += c.segs[i - 1]; frames.push({ left: c.pts[i].x + "px", top: c.pts[i].y + "px", offset: Math.min(1, acc / rem) }); }
    frames[frames.length - 1].offset = 1;
    el.style.left = c.tx + "px"; el.style.top = c.ty + "px";
    if (el.animate) el.animate(frames, { duration: rem * 1000, easing: "linear", fill: "backwards" });
  });
}

// ---------- Les chiens rapportent des trouvailles ----------
// De temps en temps, un chien bien nourri revient avec une pièce (ou, sur l'île, un coquillage rare ou un bout de carte).
// Au plus 2 trouvailles par chien et par jour ; un chien qui a faim ne rapporte rien.
const DOG_FINDS_PER_DAY = 2;
function dogFindsTick(dt) {
  if (!S.dogFinds || S.dogFinds.day !== S.day) S.dogFinds = { day: S.day, n: {} };
  cafe.gift = cafe.gift || {};
  S.cats.filter(isDog).forEach((id) => {
    const m = S.mood[id] ?? 60;
    if (cafe.gift[id] || m < 35 || (S.dogFinds.n[id] || 0) >= DOG_FINDS_PER_DAY) return;
    if (Math.random() >= (m > 75 ? 1 / 45 : 1 / 90) * dt) return;
    S.dogFinds.n[id] = (S.dogFinds.n[id] || 0) + 1;
    let g = { type: "coins", n: 1 + Math.floor(Math.random() * 5) };
    if (onIsland()) { const r = Math.random(); if ((S.mapPieces || 0) < 4 && !S.treasure && r < 0.25) g = { type: "map" }; else if (r < 0.45) g = { type: "shell", n: 15 }; }
    cafe.gift[id] = g;
  });
}
function addMapPiece() {
  S.mapPieces = Math.min(4, (S.mapPieces || 0) + 1);
  return S.mapPieces >= 4 ? "La carte est complète ! Une croix est dessinée sur l'îlot, au bout du banc de sable…" : "Un mystérieux bout de carte… (" + S.mapPieces + " / 4)";
}
function collectGift(id, quiet = false) {
  const g = cafe && cafe.gift && cafe.gift[id]; if (!g) return;
  delete cafe.gift[id];
  S.dogCoins = S.dogCoins || {};
  let msg;
  if (g.type === "map") msg = CATS[id].n + " t'a rapporté quelque chose. " + addMapPiece();
  else {
    S.coins += g.n; S.dogCoins[id] = (S.dogCoins[id] || 0) + g.n; cafe.dogCoins = (cafe.dogCoins || 0) + g.n;
    msg = g.type === "shell" ? CATS[id].n + " t'a rapporté un coquillage rare ! Le capitaine Albert te l'achète " + g.n + " pièces." : "Wouf ! " + CATS[id].n + " t'a rapporté " + g.n + " pièce" + (g.n > 1 ? "s" : "") + " !";
  }
  if (quiet) return;
  sfx("bark"); setTimeout(() => sfx("coin"), 180); toast(msg); render();
}
function giftBubble(g) {
  const icon = g.type === "map" ? `<rect x="-9" y="-7" width="18" height="13" fill="#EBD9A8" stroke="#A88A52" stroke-width="1.5"/><path d="M3 -3 l4 4 M7 -3 l-4 4" stroke="#E06A6A" stroke-width="2"/>`

  return `<svg width="40" height="36" viewBox="-20 -18 40 36" aria-hidden="true" style="position:absolute;left:9px;top:-34px;animation:bob 1s ease-in-out infinite"><path d="M-16 -15 h32 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 h-12 l-4 6 l-4 -6 h-12 a3 3 0 0 1 -3 -3 v-18 a3 3 0 0 1 3 -3z" fill="#fff" stroke="#F2C46D" stroke-width="2.5"/><g transform="translate(0 -3)">${icon}</g></svg>`;

function pickOrder() {
  const avail = S.recipes.filter((id) => (S.showcase[id] || 0) > 0);
  if (avail.length && Math.random() < 0.8) return avail[Math.floor(Math.random() * avail.length)];
  return S.recipes[Math.floor(Math.random() * S.recipes.length)];
}
function tickCafe() {
  if (ui.screen !== "cafe" || ui.modal) return;
  const now = performance.now(); const dt = Math.min(0.5, (now - cafe.last) / 1000); cafe.last = now;
  cafe.time += dt;
  // humeur des chats
  S.cats.forEach((c) => { S.mood[c] = Math.max(0, (S.mood[c] ?? 60) - dt * CAT_HUNGER * toyFactor()); });
  ensureCatPositions(); moveCats(dt); dogFindsTick(dt);
  // patience
  cafe.seats.forEach((cl, i) => {
    if (!cl) return;
    if (cl.leaving) { cl.leaving -= dt; if (cl.leaving <= 0) cafe.seats[i] = null; return; }
    cl.patience -= dt / cl.maxPat;
    if (cl.patience <= 0) { cl.leaving = 1.6; cl.msg = "Tant pis, une autre fois !"; cafe.missed++; }
  });
  // arrivées
  cafe.nextSpawn -= dt;
  const free = cafe.seats.indexOf(null);
  if (cafe.spawned < clientsPerDay() && cafe.nextSpawn <= 0 && free >= 0) {
    // un villageois qui n'est pas déjà assis (ou un touriste)
    const present = cafe.seats.filter(Boolean).map((c) => c.v.n);
    const pool = VILLAGERS.filter((x) => !present.includes(x.n));
    const v = projDone("gare") && Math.random() < 0.35
      ? Object.assign({ role: "touriste", tourist: true, fav: null }, TOURISTS[Math.floor(Math.random() * TOURISTS.length)])
      : pool[Math.floor(Math.random() * pool.length)] || VILLAGERS[0];
    const favOk = S.recipes.includes(v.fav) && (S.showcase[v.fav] || 0) > 0 && Math.random() < 0.5;
    sfx("bell");
    cafe.seats[free] = { v, order: favOk ? v.fav : pickOrder(), patience: 1, maxPat: (30 + avgMood() / 5) * (projDone("fontaine") ? 1.25 : 1) * (1 + 0.05 * dogCount()) * (0.8 + Math.random() * 0.4), msg: null, leaving: 0 };
    cafe.spawned++;
    // arrivées irrégulières : parfois un petit groupe, parfois un long moment calme
    const r = Math.random();
    cafe.nextSpawn = r < 0.18 ? 0.3 + Math.random() * 0.8   // quelqu'un entre juste derrière
                   : r < 0.75 ? 2 + Math.random() * 5       // rythme normal
                   : 7 + Math.random() * 6;                 // accalmie
    if (r < 0.18) setTimeout(() => toast("Un petit groupe arrive !"), 200);
  }
  // fin du service
  if (cafe.spawned >= clientsPerDay() && cafe.seats.every((x) => !x)) { endDay(); return; }
  render();
}
function serve(i) {
  const cl = cafe.seats[i]; if (!cl || cl.leaving) return;
  let dish = cl.order, swapped = false;
  if (!(S.showcase[dish] > 0)) {
    // plus en vitrine : on propose autre chose (pas de pourboire, mais personne ne repart fâché)
    dish = S.recipes.find((r) => S.showcase[r] > 0);
    if (!dish) { toast("La vitrine est vide…"); return; }
    swapped = true;
  }
  S.showcase[dish]--;
  const price = Math.round(RECIPES[dish].price * (cl.v.tourist ? 1.5 : 1));
  const tip = swapped ? 0 : Math.round(price * (0.1 + catBonus() + decorBonus()) * (0.5 + cl.patience / 2));
  S.coins += price + tip; cafe.earned += price; cafe.tips += tip; cafe.served++; S.servedTotal++; S.rep++;
  cl.leaving = 1.6; cl.msg = swapped ? "Bon, je vais goûter ça alors !" : tip >= 4 ? "Délicieux ! Merci beaucoup !" : "Merci, c'était bon !";
  cl.paid = `+${price + tip}`;
  // amitié (pas pour les touristes)
  S.friend = S.friend || {}; S.stories = S.stories || {};
  if (cl.v.tourist) { sfx("coin"); render(); return; }
  const name = cl.v.n, before = hearts(name);
  S.friend[name] = (S.friend[name] || 0) + 1 + (!swapped && dish === cl.v.fav ? 2 : 0);
  const seen = S.stories[name] || 0;
  if (seen < STORY_AT.length && hearts(name) >= STORY_AT[seen]) {
    S.stories[name] = seen + 1;
    const gift = [{ coins: 20 }, { coins: 35 }, { coins: 60, rep: 3 }][seen];
    S.coins += gift.coins; S.rep += gift.rep || 0;
    cafe.events.push({ name, text: cl.v.stories[seen], gift });
    setTimeout(() => { toast("♥ " + name + " se confie à toi ! (+" + gift.coins + " pièces)"); sfx("heart"); }, 400);
  } else if (hearts(name) > before) { setTimeout(() => { toast("♥ " + name + " t'apprécie de plus en plus"); sfx("heart"); }, 400); }
  else sfx("coin");
  render();
}

const petFood = (id) => Object.fromEntries(Object.entries(ITEMS).filter(([, it]) => it.cat && !!it.dog === isDog(id)).map(([k, it]) => [k, it.fx]).sort((a, b) => b[1] - a[1]));

function feedAll() {
  const hungry = S.cats.filter((id) => (S.mood[id] ?? 60) < 85).sort((a, b) => (S.mood[a] ?? 60) - (S.mood[b] ?? 60));
  if (!hungry.length) { toast("Tout le monde est repu !"); return; }
  let fed = 0;
  for (const id of hungry) {
    // la plus petite friandise qui suffit, pour ne pas gaspiller les crevettes
    const FOOD = petFood(id);
    const need = 100 - (S.mood[id] ?? 60);
    const avail = Object.keys(FOOD).filter((k) => qty(k) > 0);
    if (!avail.length) continue;
    const food = avail.slice().reverse().find((k) => FOOD[k] >= need) || avail[0];
    S.pantry[food]--; S.mood[id] = Math.min(100, (S.mood[id] ?? 60) + FOOD[food]); fed++;
  }
  sfx("pop");
  toast(fed ? fed + (fed > 1 ? " animaux se régalent" : " animal se régale") + (fed < hungry.length ? " (il manque de la nourriture pour les autres !)" : " !") : "Plus de nourriture : passe à l'" + animShopName() + ".");
  render();
}

// ---------- Fin de journée ----------
let summaryData = null;
function endDay() {
  stopCafe();
  Object.keys(cafe.gift || {}).forEach((id) => collectGift(id, true));
  const newcomers = [];
  const cond = {
    brume: () => S.decor.includes("coussin"),
    biscotte: () => S.decor.includes("panier"),
    plume: () => S.decor.includes("fauteuil"),
    noisette: () => S.decor.includes("aquarium"),
    moka: () => S.servedTotal >= 20,
    pistache: () => bridgeDone(),
  };
  if (!onIsland()) for (const id of Object.keys(cond)) if (!S.cats.includes(id) && cond[id]()) { S.cats.push(id); S.mood[id] = 60; newcomers.push(id); break; } // un nouveau chat par jour max
  summaryData = { events: cafe.events, served: cafe.served, missed: cafe.missed, earned: cafe.earned, tips: cafe.tips, newcomers, mood: Math.round(avgMood()) };
  // les plats non vendus restent (un peu moins frais, c'est cozy)
  const morning = [];
  if (projDone("lanternes")) { S.rep += 1; morning.push(onIsland() ? "Les lampions ont attiré du monde sur la plage : +1 réputation." : "Les lanternes ont attiré du monde sur la place : +1 réputation."); }
  if (projDone("moulin") && onIsland()) { S.pantry.coco = qty("coco") + 2; S.pantry.banane = qty("banane") + 1; morning.push("La cocoteraie t'a donné 2 noix de coco et des bananes."); }
  else if (projDone("moulin")) { S.pantry.farine = qty("farine") + 2; S.pantry.miel = qty("miel") + 1; morning.push("Le meunier t'a livré 2 farines et 1 pot de miel."); }
  const found = cafe.dogCoins || 0;
  if (found) morning.push("Tes chiens t'ont rapporté " + found + " pièce" + (found > 1 ? "s" : "") + " aujourd'hui. Wouf !");
  summaryData.morning = morning;
  S.day++; S.phase = "matin"; S.letterRead = false; S.bouquet = false; S.bouquetId = null;
  S.weather = rollWeather();
  if (dayInSeason() === 1 && !onIsland()) {
    morning.push("Une nouvelle saison commence : " + season() + " ! L'épicerie a de nouveaux produits de saison.");
    const gift = Object.entries(RECIPES).find(([id, r]) => r.gift && r.season === season() && !S.recipes.includes(id));
    if (gift) { S.recipes.push(gift[0]); morning.push("Madame Rose t'offre la recette de saison : « " + gift[1].n + " » !"); }
  }
  if (festival()) morning.push("Demain, c'est la " + festival() + " : plus de clients et +20 % de pourboires !");
  else if (S.weather === "pluie") morning.push("Il pleuvra demain : les villageois viendront se mettre à l'abri au café (+2 clients).");
  else if (S.weather === "neige") morning.push("Il neigera demain : parfait pour un chocolat chaud (+1 client).");
  const newIn = onIsland() ? { creperie: "la crêperie", glacier: "chez le glacier", animplage: "l'animalerie", surf: "la boutique de surf", souvenirs: "la boutique de souvenirs" } : { librairie: "la librairie", brocante: "la brocante", refuge: "l'animalerie" };
  Object.keys(newIn).forEach((tab) => { if (shopCatalogAll(tab).some((x) => UNLOCK[x.id] === S.day)) morning.push("Nouveautés à " + newIn[tab] + " !"); });
  Object.keys(PROJECTS).forEach((id) => { if (projDay(id) === S.day) morning.push((onIsland() ? "Nouveau projet sur l'île : « " : "Nouveau projet au village : « ") + PROJECTS[id].n + " » ! Regarde la carte."); });
  // points et pièces du lanceur Mes Jeux
  if (window.MesJeux && summaryData.served > 0 && !TEST) {
    const lignes = [[30, "Journée au café terminée"]];
    lignes.push([summaryData.served * 2, summaryData.served + " client" + (summaryData.served > 1 ? "s servis" : " servi")]);
    if (!summaryData.missed) lignes.push([10, "Personne n'est reparti les mains vides"]);
    if (summaryData.newcomers.length) lignes.push([10, "Un nouveau chat s'installe"]);
    if (summaryData.events.length) lignes.push([5 * summaryData.events.length, "Confidence d'un villageois"]);
    try { MesJeux.award("ronrons", lignes, { score: summaryData.earned + summaryData.tips }); } catch (e) {}
  }
  cafe = null; save();
  ui.screen = "summary"; render();
}

// ---------- Actions ----------
function act(a, el, isKey = false) {
  const id = el.dataset.id;
  switch (a) {
    case "new": clearSave(); applyIsland("bruyere"); S = TEST ? testGame() : newGame(); save(); saveMeta({ cur: "bruyere", coq: false }); go("village"); ui.modal = TEST ? null : helpModal; render(); if (TEST) toast("Mode test : Bruyère est terminée, le bateau pour l'île t'attend !"); break;
    case "help": ui.modal = helpModal; render(); break;
    case "launcher": location.href = "../"; break;
    case "continue": S = null; openIsland(loadMeta().cur); go("village"); break;
    case "village": go("village"); break;
    case "depart": if (cafe) { toast("Termine d'abord ta journée au café !"); break; } ui.departPick = null; go("depart"); break;
    case "departpick": ui.departPick = id; sfx(isDog(id) ? "bark" : "purr"); render(); break;
    case "embark": {
      const comp = ui.departPick; if (!comp || !S.cats.includes(comp)) break;
      const purse = S.coins; S.coins = 0; save(); const m = loadMeta(); m.coq = true; m.cur = "coq"; saveMeta(m);
      localStorage.removeItem(islandKey("coq"));
      applyIsland("coq"); S = newGame("coq", comp); S.coins = purse; S.recipes.forEach((r) => { S.showcase[r] = 0; }); save();
      cafe = null; ui.cook = null; ui.kitchenSel = S.recipes[0]; ui.screen = "village"; ui.modal = islandWelcomeModal; sfx("done"); render(); break;
    }
    case "toisland": case "tobruyere": {
      if (cafe || ui.cook) { toast("Termine d'abord ta journée au café !"); break; }
      const dest = a === "toisland" ? "coq" : "bruyere", purse = S.coins; S.coins = 0;
      openIsland(dest); S.coins += purse; save(); sfx("bell");
      go("village"); toast(dest === "coq" ? "Le bateau accoste sur l'île aux Coquillages." : "Te revoilà à Bruyère ! Papi Jules agite son chapeau sur le quai."); break;
    }
    case "grotte": toast(S.treasure ? "La grotte est calme. Doublon y fait parfois la sieste au frais." : (S.mapPieces || 0) >= 4 ? "D'après la carte, ce n'est pas ici… regarde plutôt l'îlot !" : "Il fait tout noir… On entend comme un drôle de bruit, tout au fond."); break;
    case "treasure": if ((S.mapPieces || 0) < 4 || S.treasure) break;
      S.treasure = true; S.coins += 250; if (!S.cats.includes("doublon")) { S.cats.push("doublon"); S.mood.doublon = 90; }
      save(); sfx("done"); ui.modal = treasureModal; render(); break;
    case "albumtab": ui.albumTab = el.dataset.tab; render(); break;
    case "tovillage": go("village"); toast("Le service est en pause pendant ta balade."); break;
    case "album": go("album"); break;
    case "friends": go("friends"); break;
    case "sound": toggleSound(); render(); break;
    case "kitchen": { const during = ui.screen === "cafe" && cafe; go("kitchen"); if (during) toast("Le service est en pause pendant que tu cuisines."); break; }
    case "shop": ui.shopTab = el.dataset.tab; go("shop"); break;
    case "cart+": { const it = shopCatalog(ui.shopTab).find((x) => x.id === id); if (it.kind !== "item" && ui.cart[id]) break;
      if (it.kind === "bouquet" && (S.bouquetId || Object.keys(ui.cart).length)) { toast("Un seul bouquet par jour !"); break; } ui.cart[id] = (ui.cart[id] || 0) + 1; render(); break; }
    case "cart-": ui.cart[id] = (ui.cart[id] || 0) - 1; if (ui.cart[id] <= 0) delete ui.cart[id]; render(); break;
    case "pay": {
      const total = cartTotal(); if (!total || total > S.coins) break;
      S.coins -= total;
      for (const [k, q] of Object.entries(ui.cart)) {
        const it = shopCatalog(ui.shopTab).find((x) => x.id === k);
        if (it.kind === "item") S.pantry[k] = qty(k) + q;
        else if (it.kind === "decor") S.decor.push(k);
        else if (it.kind === "book") S.recipes.push(k);
        else if (it.kind === "bouquet") { S.bouquet = BOUQUETS[k].tip; S.bouquetId = k; }
        else if (it.kind === "cat") { S.cats.push(k); S.mood[k] = 75; setTimeout(() => { toast(CATS[k].n + " rejoint ton café !"); sfx(isDog(k) ? "bark" : "purr"); }, 300); }
      }
      ui.cart = {}; save(); sfx("coin"); render(); toast("Merci ! À bientôt."); break;
    }
    case "donate": {
      const pid = el.dataset.id, P = PROJECTS[pid]; if (!P || projDone(pid) || !projOpen(pid)) break;
      const amt = Math.min(+el.dataset.amt || 25, S.coins, P.goal - (S.projects[pid] || 0)); if (amt <= 0) { toast("Pas assez de pièces."); break; }
      S.coins -= amt; S.projects[pid] = (S.projects[pid] || 0) + amt; save();
      if (projDone(pid)) {
        const extra = onIsland() && (S.mapPieces || 0) < 4 && !S.treasure ? "Pendant les travaux, on a trouvé quelque chose. " + addMapPiece() : "";
        save(); sfx("done"); ui.modal = () => projectDoneModal(pid, extra); render();
      }
      else { sfx("coin"); render(); toast("Merci pour le projet « " + P.n + " » !"); }
      break;
    }
    case "projects": go("projects"); break;
    case "bouquet": if (S.bouquet) { toast("Le bouquet embaume déjà le café."); break; } if (S.coins < 15) { toast("Pas assez de pièces."); break; } S.coins -= 15; S.bouquet = true; save(); render(); toast("Bouquet installé : +10 % de pourboires aujourd'hui"); break;
    case "letter": if (S.letterRead) { toast(onIsland() ? "Pas de bouteille aujourd'hui." : "Pas de nouvelle lettre aujourd'hui."); break; } { const li = (S.day - 1) % LETTERS.length, L = LETTERS[li]; S.letterRead = true; if (onIsland()) { S.bottles = S.bottles || []; if (!S.bottles.includes(li)) S.bottles.push(li); sfx("swish"); } S.coins += L.coins || 0; S.rep += L.rep || 0; save(); ui.modal = letterModal; render(); } break;
    case "closemodal": ui.modal = null; render(); break;
    case "jules": {
      ui.modal = julesModal;
      if (!bridgeDone() && !S.julesGift) { render(); S.julesGift = true; S.julesFish = true; S.pantry.poisson = qty("poisson") + 1; save(); break; }
      render(); break;
    }
    case "pick": if (!ui.cook) { ui.kitchenSel = id; render(); } break;
    case "cook": {
      if (ui.cook || !canCook(ui.kitchenSel)) break;
      const r = RECIPES[ui.kitchenSel];
      for (const [k, v] of Object.entries(r.needs)) S.pantry[k] -= v;
      ui.cook = { id: ui.kitchenSel, i: 0, prog: 0, taps: 0, drops: unitsOf(r).map(() => false), ovenIn: false, ang: 0 };
      save(); render(); break;
    }
    case "drop": { const c = ui.cook; if (!c) break; c.drops[+el.dataset.i] = true; sfx("pop"); if (c.drops.every(Boolean)) advanceCook(); else render(); break; }
    case "tapbowl": {
      const c = ui.cook, k = curKind(); if (!c || !TAPS[k]) break;
      c.taps++; c.justTapped = true; sfx(k === "knead" ? "knead" : "pop");
      if (c.taps >= TAPS[k]) { c.justTapped = false; advanceCook(); } else { render(); c.justTapped = false; }
      break;
    }
    case "stirbowl": {
      const c = ui.cook; if (!c) break;
      if (isKey) { c.prog = Math.min(1, c.prog + 0.2); c.ang += 72; sfx("swish"); if (c.prog >= 1) advanceCook(); else render(); }
      else { c.stirring = true; c.lastAng = null; }
      break;
    }
    case "oven": { const c = ui.cook; if (!c) break; if (!c.ovenIn) { c.ovenIn = true; c.prog = 0; sfx("oven"); render(); } else if (c.prog >= 1) advanceCook(); break; }
    case "opencafe":
      if (ui.cook) { toast("Termine d'abord ta recette !"); if (ui.screen !== "kitchen") go("kitchen"); break; }
      if (cafe) { go("cafe"); break; } // reprise du service
      if (!S.recipes.some((r) => S.showcase[r] > 0)) { toast("La vitrine est vide : cuisine au moins un plat."); break; }
      go("cafe"); break;
    case "serve": serve(+el.dataset.i); break;
    case "pet": pet(id); break;
    case "feed": feed(id); break;
    case "feedall": feedAll(); break;
  }
}
// pointerdown : évite de perdre un clic quand le café se redessine
$stage.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  e.preventDefault(); audioInit(); if (!["drop", "tapbowl", "stirbowl", "serve", "pet", "pay", "oven"].includes(el.dataset.a)) sfx("click"); act(el.dataset.a, el);
});
$stage.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  e.preventDefault(); audioInit(); act(el.dataset.a, el, true);
});
window.addEventListener("pointermove", stirMove);
window.addEventListener("pointerup", () => { if (ui.cook) ui.cook.stirring = false; });

// ---------- Mise à l'échelle ----------
// Le jeu est dessiné en 1280×720 puis mis à l'échelle de l'écran.
// Téléphone tenu en portrait : l'image est tournée d'un quart de tour pour occuper tout l'écran.
function fit() {
  const vv = window.visualViewport;
  const W = vv ? vv.width : window.innerWidth, H = vv ? vv.height : window.innerHeight;
  const portrait = H > W * 1.05;
  const s = portrait ? Math.min(W / 720, H / 1280) : Math.min(W / 1280, H / 720);
  $stage.style.transform = `translate(-50%, -50%) ${portrait ? "rotate(90deg) " : ""}scale(${s})`;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 150));
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
fit();
render();
</script>
