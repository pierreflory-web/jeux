<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
<style>html,body{margin:0;height:auto}*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Le sapin des surprises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Papier de Noël : fond crème étoilé, sapin de boules colorées, une page par case */
:root{
  --papier:#F3EFE4; --papier-2:#FFFDF8; --encre:#3A3631; --encre-2:#6B655C; --etoile:#C9C2B2; --tronc:#8A5A1E; --ligne:#E2DCCD;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --texte:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--papier);color:var(--encre)}
body{font-family:var(--texte);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden;min-height:100%}
#ciel{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.et{position:absolute;top:-24px;color:var(--etoile);animation:tomber linear infinite;line-height:1}
.et span{display:inline-block;animation:briller 2.6s ease-in-out infinite}
@keyframes tomber{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,55vh) rotate(90deg)}100%{transform:translate(-6px,110vh) rotate(180deg)}}
@keyframes briller{0%,100%{opacity:.35}50%{opacity:1}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-block:28px 40px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
#vue-sapin header{text-align:center;display:flex;flex-direction:column;gap:4px;margin-bottom:22px}
#vue-sapin h1{font-size:clamp(30px,8vw,40px);color:var(--encre)}
.date{font-size:15px;color:var(--encre-2);font-weight:600}
.attente{margin:6px auto 0;background:var(--papier-2);border:1px solid var(--ligne);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;display:inline-block}
.apercu{align-self:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#3A3631;color:#fff;border-radius:999px;padding:3px 10px}
.sapin{display:flex;flex-direction:column;align-items:center;gap:7px}
.rang{display:flex;gap:7px;justify-content:center}
.boule{--t:clamp(40px,12.5vw,58px);width:var(--t);height:var(--t);border-radius:50%;border:none;padding:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:calc(var(--t)*.38);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.boule:hover{transform:scale(1.06)}
.boule:focus-visible{outline:3px solid var(--encre);outline-offset:3px}
.boule.future{color:rgba(255,255,255,.95)}
.boule .ti-etoile{display:inline-block;font-size:calc(var(--t)*.5);animation:balance 2.4s ease-in-out infinite}
@keyframes balance{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.rebond{animation:rebond .55s ease}
@keyframes rebond{0%{transform:scale(1)}30%{transform:scale(1.22) translateY(-7px)}60%{transform:scale(.93)}100%{transform:scale(1)}}
.tronc{width:clamp(44px,13vw,60px);height:24px;background:var(--tronc);border-radius:0 0 6px 6px;margin-top:2px}
.bulle{min-height:40px;display:flex;justify-content:center;margin-top:14px}
.bulle p{margin:0;background:var(--encre);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;text-align:center}
.legende{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.puce{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 11px 4px 6px;border-radius:999px;background:var(--papier-2);border:1px solid var(--ligne)}
.puce{padding-left:8px}
.symb{width:20px;height:20px;display:inline-block;flex-shrink:0}
.pied{text-align:center;font-size:13px;color:var(--encre-2);margin-top:22px}

#vue-case{animation:glisser .3s ease}
@keyframes glisser{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.retour{background:none;border:none;padding:8px;margin:-8px 0 0 -8px;cursor:pointer;color:var(--encre);font-size:26px;line-height:1;border-radius:10px;display:inline-flex}
.retour:focus-visible{outline:3px solid var(--encre)}
.hero{text-align:center;margin:6px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.photo{width:100%;max-width:340px;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:var(--papier-2);border:6px solid var(--papier-2);box-shadow:0 10px 30px rgba(58,54,49,.15);animation:apparaitre .6s ease}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo + .emojis{margin-top:-46px;position:relative}
@keyframes apparaitre{from{transform:scale(.94) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.emojis{font-size:clamp(54px,17vw,76px);line-height:1.1;display:flex;gap:6px;justify-content:center}
.emojis span{display:inline-block;animation:flotter 3s ease-in-out infinite}
.emojis span:nth-child(2){animation-delay:.4s}.emojis span:nth-child(3){animation-delay:.8s}.emojis span:nth-child(4){animation-delay:1.2s}
@keyframes flotter{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.etiquette{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.hero h2{font-size:clamp(28px,7.5vw,36px)}
.hero .jour{font-size:14px;color:var(--encre-2);font-weight:600}
.contenu{display:flex;flex-direction:column;gap:16px}
.contenu p{margin:0;max-width:65ch}
.carte{background:var(--papier-2);border:1px solid var(--ligne);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.carte h3{font-size:20px}
.carte ul,.carte ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.carte ol li::marker{font-family:var(--display);font-weight:700}
.infos{display:flex;flex-wrap:wrap;gap:8px}
.infos span{font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--papier);border:1px solid var(--ligne)}
.devinette{background:#FBEFD6;border-color:#F1D9A6;color:#5E3B05}
.devinette h3{font-size:18px}
.btn{font-family:var(--texte);font-weight:700;font-size:15px;border-radius:999px;padding:9px 18px;border:1.5px solid currentColor;background:transparent;color:inherit;cursor:pointer;align-self:flex-start}
.btn:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
.reponse{font-weight:700}
.quiz-q{display:flex;flex-direction:column;gap:8px}
.quiz-q + .quiz-q{border-top:1px dashed var(--ligne);padding-top:12px}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix button{font-family:var(--texte);font-size:14px;font-weight:600;border-radius:12px;border:1.5px solid var(--ligne);background:var(--papier);color:var(--encre);padding:7px 12px;cursor:pointer;text-align:left}
.choix button.bon{background:#E1F3D3;border-color:#7BB04A;color:#27500A}
.choix button.faux{background:#FBE1E1;border-color:#E39A9A;color:#791F1F}
.choix button:disabled{cursor:default}
.score{font-family:var(--display);font-weight:700;font-size:20px}
.signature{text-align:center;font-family:var(--display);font-size:22px;font-weight:700}
@media (prefers-reduced-motion:reduce){.photo,.et,.et span,.emojis span,.boule .ti-etoile,.rebond,#vue-case{animation:none}.et{top:auto}}
</style>
</head>
<body>

<div id="ciel" aria-hidden="true"></div>
<main>
  <section id="vue-sapin">
    <header>
      <span class="apercu" id="badge-apercu" hidden>Aperçu : toutes les cases ouvertes</span>
      <h1>Le sapin des surprises</h1>
      <p class="date" id="date-du-jour"></p>
      <div><span class="attente" id="attente" hidden></span></div>
    </header>
    <div class="sapin" id="sapin" role="group" aria-label="Les 24 boules du calendrier"></div>
    <div class="bulle" aria-live="polite"><p id="bulle" hidden></p></div>
    <div class="legende" id="legende"></div>
    <p class="pied">Une boule s'allume chaque jour jusqu'à Noël. Touchez une boule allumée pour l'ouvrir.</p>
  </section>

  <section id="vue-case" hidden>
    <button class="retour" id="retour" aria-label="Revenir au sapin">←</button>
    <div class="hero">
      <div class="photo" id="c-photo" hidden><img id="c-img" alt=""></div>
      <div class="emojis" id="c-emojis" aria-hidden="true"></div>
      <span class="etiquette" id="c-etiquette"></span>
      <h2 id="c-titre"></h2>
      <span class="jour" id="c-jour"></span>
    </div>
    <div class="contenu" id="c-contenu"></div>
  </section>
</main>

<script>
const CAT={
  L:{nom:"Geste solidaire",vif:"#E24B4A",pale:"#F7C1C1",fonce:"#A32D2D",fond:"#FCEBEB"},
  R:{nom:"Recette",vif:"#D85A30",pale:"#F5C4B3",fonce:"#993C1D",fond:"#FAECE7"},
  T:{nom:"Culture de Noël",vif:"#7F77DD",pale:"#CECBF6",fonce:"#534AB7",fond:"#EEEDFE"},
  N:{nom:"Énigme et quiz",vif:"#378ADD",pale:"#B5D4F4",fonce:"#185FA5",fond:"#E6F1FB"},
  P:{nom:"Défi photo",vif:"#1D9E75",pale:"#9FE1CB",fonce:"#0F6E56",fond:"#E1F5EE"},
  E:{nom:"Défi partagé",vif:"#639922",pale:"#C0DD97",fonce:"#3B6D11",fond:"#EAF3DE"},
  B:{nom:"Blague",vif:"#BA7517",pale:"#FAC775",fonce:"#854F0B",fond:"#FAEEDA"},
  F:{nom:"Le grand final",vif:"#EF9F27",pale:"#FAC775",fonce:"#854F0B",fond:"#FAEEDA"}
};

const carte=(titre,html,cls="")=>`<div class="carte ${cls}">${titre?`<h3>${titre}</h3>`:""}${html}</div>`;
const liste=(items,ord)=>`<${ord?"ol":"ul"}>${items.map(i=>`<li>${i}</li>`).join("")}</${ord?"ol":"ul"}>`;
const infos=a=>`<div class="infos">${a.map(x=>`<span>${x}</span>`).join("")}</div>`;
const reveler=(label,rep)=>`<button class="btn" data-reveler>${label}</button><p class="reponse" hidden>${rep}</p>`;
const devinette=(q,r)=>carte("😄 Devinette bonus",`<p>${q}</p>${reveler("Voir la réponse",r)}`,"devinette");
const recette=(r)=>carte("🧑‍🍳 La recette",`${infos(r.infos)}<h3 style="font-size:17px">Ingrédients</h3>${liste(r.ing)}<h3 style="font-size:17px">Étapes</h3>${liste(r.etapes,true)}${r.astuce?`<p>💡 ${r.astuce}</p>`:""}`);

const C={
1:{c:"P",e:["🎄","✨","📸"],t:"Le sapin s'allume",h:()=>`
<p>Bienvenue dans le sapin des surprises ! 🎉 Jusqu'au 24 décembre, une nouvelle boule s'allume chaque matin. Sa couleur annonce le genre de surprise : recette, geste solidaire, énigme, culture de Noël, défi photo…</p>
${carte("📸 Le défi du jour",`<p>Photographiez votre coin de Noël : le sapin, la crèche, une fenêtre décorée, ou même une simple bougie. Envoyez la photo à toute la famille pour lancer le mois en beauté.</p>`)}
${devinette("Qu'est-ce qui est vert, plein de boules, et va très vite ?","Un sapin en trottinette ! 🛴🎄")}`},
2:{c:"B",e:["🎅","😂"],t:"Le comble du Père Noël",h:()=>`
${carte("😂 La blague du jour",`<p>Quel est le comble pour le Père Noël ?</p>${reveler("Voir la réponse","Avoir le vertige… alors qu'il passe toute la nuit sur les toits ! 🏠🎅")}`)}
<p>À raconter au dîner, au téléphone ou par message. Celui qui la connaissait déjà doit en trouver une autre ! 😉</p>`},
3:{c:"L",e:["💌","🏡"],t:"Un mot pour un voisin",h:()=>`
${carte("💌 Le geste du jour",`<p>Glissez une petite carte de vœux dans la boîte aux lettres d'un voisin. Un dessin, un « Joyeuses fêtes » et votre prénom suffisent.</p><p>Les plus jeunes peuvent dessiner, les plus grands écrire. Le voisin qu'on croise sans jamais se parler sera sûrement le plus touché.</p>`)}
${devinette("Qu'est-ce qui tombe tout l'hiver sans jamais se faire mal ?","La neige ! ❄️")}`},
4:{c:"N",e:["🧝","🎁","🤔"],t:"L'énigme des lutins",h:()=>`
${carte("🤔 L'énigme",`<p>3 lutins emballent 3 cadeaux en 3 minutes.</p><p>Combien de temps faut-il à 100 lutins pour emballer 100 cadeaux ?</p>${reveler("Voir la réponse","3 minutes ! Chaque lutin emballe un cadeau en 3 minutes, qu'ils soient 3 ou 100. 🎁")}`)}
<p>Posez-la à quelqu'un de la famille avant de regarder la réponse : on est souvent tenté de dire 100 ! 😄</p>`},
5:{c:"L",e:["🤝","🛒"],t:"Un coup de main",h:()=>`
${carte("🤝 Le geste du jour",`<p>Rendez un petit service à un voisin ou à un proche, sans qu'il le demande :</p>${liste(["porter ses courses 🛍️","sortir sa poubelle 🗑️","lui rapporter du pain 🥖","l'aider à installer une décoration 🎀"])}`)}
<p>C'est samedi : on a un peu plus de temps pour les autres.</p>
${devinette("Pourquoi les sapins sont-ils nuls en couture ?","Parce qu'ils perdent toujours leurs aiguilles ! 🪡🌲")}`},
6:{c:"R",e:["🍫","🎅","✨"],t:"Truffes au chocolat",h:()=>`
<p>Première recette, sans four ! Parfait pour fêter la Saint-Nicolas. 🎉</p>
${recette({infos:["⏱️ 20 min","❄️ 2 h au frais","🔥 Sans four","🍫 20 truffes","⭐ Facile"],
ing:["200 g de chocolat noir","10 cl de crème liquide entière","30 g de beurre","3 cuillères à soupe de cacao en poudre non sucré"],
etapes:["Hacher le chocolat et le mettre dans un saladier.","Faire chauffer la crème jusqu'aux premiers frémissements.","Verser la crème chaude sur le chocolat, attendre 1 minute, puis mélanger doucement du centre vers les bords.","Ajouter le beurre et mélanger jusqu'à ce que ce soit lisse et brillant.","Couvrir et laisser 2 heures au réfrigérateur.","Prélever des petites cuillerées de pâte et les rouler en boule entre les mains.","Rouler chaque boule dans le cacao. Garder au frais jusqu'à la dégustation."],
astuce:"Passez-vous les mains sous l'eau froide avant de rouler les truffes. Variantes : noix de coco râpée ou sucre glace."})}
${carte("🎅 Qui était saint Nicolas ?",`<p>Nicolas était un évêque qui vivait au 4e siècle à Myre, dans l'actuelle Turquie. Il était connu pour sa grande générosité et devint le protecteur des enfants.</p><p>On le fête le 6 décembre, surtout dans l'Est de la France, en Belgique et aux Pays-Bas. Il passe avec son âne déposer des friandises, accompagné du Père Fouettard. Aux Pays-Bas, on l'appelle Sinterklaas : c'est lui qui a inspiré le personnage du Père Noël ! 🎁</p>`)}`},
7:{c:"P",e:["🔍","📸","❓"],t:"Le zoom mystère",h:()=>`
${carte("🔍 Le défi du jour",`<p>Prenez une photo en très gros plan d'une décoration de chez vous, si près qu'on ne la reconnaît plus : un bout de guirlande, une boule, le pied du sapin…</p><p>Envoyez-la à la famille sans rien dire. Qui devinera le premier ? 🕵️</p>`)}
${devinette("Comment appelle-t-on un chat tombé dans un pot de peinture le jour de Noël ?","Un chat-peint de Noël ! 🐱🎄")}`},
8:{c:"R",e:["🍫","🌰","🍇"],t:"Mendiants",h:()=>`
<p>Deuxième recette sans four : de petits disques de chocolat couverts de fruits secs. Joli, facile et délicieux. 😋</p>
${recette({infos:["⏱️ 20 min","❄️ 1 h au frais","🔥 Sans four","🍫 20 mendiants","⭐ Facile"],
ing:["200 g de chocolat noir ou au lait","Une poignée d'amandes","Une poignée de noisettes","Une poignée de raisins secs","Quelques pistaches ou écorces d'orange confite"],
etapes:["Couvrir une plaque de papier cuisson.","Faire fondre le chocolat au bain-marie à feu doux, ou au micro-ondes par tranches de 30 secondes en remuant.","Déposer des cuillerées de chocolat et les étaler en petits disques d'environ 4 cm.","Placer aussitôt les fruits secs sur chaque disque, avant que le chocolat durcisse.","Laisser prendre 1 heure au réfrigérateur, puis décoller délicatement."],
astuce:"Mettez les fruits secs dans des petits bols avant de commencer : tout le monde peut décorer en même temps."})}
${carte("🌿 Les 13 desserts de Provence",`<p>En Provence, après le repas du soir du 24 décembre, on pose sur la table 13 desserts, en souvenir du Christ et des 12 apôtres. On y trouve des fruits secs, des dattes, du nougat blanc et noir, la pompe à l'huile, des fruits frais…</p><p>Les mendiants en font partie. Leur nom vient de quatre ordres de moines mendiants, dont les robes avaient la couleur des fruits secs : les raisins, les figues, les amandes et les noisettes. 🍇🌰</p>`)}`},
9:{c:"L",e:["💐","📮","😊"],t:"Merci !",h:()=>`
${carte("💐 Le geste du jour",`<p>Remerciez quelqu'un qu'on croise souvent sans jamais lui dire merci : le facteur, la boulangère, le gardien, les éboueurs, la caissière…</p><p>Un petit mot, un dessin ou simplement un grand sourire et un « Merci pour tout ce que vous faites ». Ça ne prend qu'une minute et ça illumine une journée. ☀️</p>`)}
${devinette("Qu'est-ce qu'un bonhomme de neige qui a pris des vacances au soleil ?","Une flaque ! ☀️⛄💧")}`},
10:{c:"E",e:["🎶","🎧","💃"],t:"La playlist de Noël",h:()=>`
${carte("🎶 Le défi du jour",`<p>Chacun envoie à la famille le titre d'une chanson de Noël qu'il aime, ou qui lui rappelle un souvenir.</p><p>Ce soir, mettez toute la playlist en fond sonore pendant le dîner. Bonus : raconter pourquoi on a choisi sa chanson. 🎤</p>`)}
${devinette("Que dit un flocon de neige à son copain ?","« On se fait une boule ? » ❄️⛄")}`},
11:{c:"N",e:["🛷","🔐","🧩"],t:"Le code du traîneau",h:()=>`
${carte("🔐 Le message codé",`<p>Le Père Noël a laissé un message secret sur son traîneau :</p><p style="font-family:var(--display);font-size:28px;letter-spacing:.12em;text-align:center">KPZFVY OPFM</p><p>Un indice : chaque lettre a été remplacée par la lettre qui la suit dans l'alphabet.</p>${reveler("Voir la solution","JOYEUX NOËL ! 🎄 (K devient J, P devient O, Z devient Y…)")}`)}
<p>À vous d'envoyer un message codé à la famille avec la même méthode ! 🤫</p>`},
12:{c:"R",e:["☕","🍫","🪵"],t:"Chocolat chaud épicé",h:()=>`
<p>Troisième recette sans four, juste une casserole. Le réconfort parfait pour un samedi d'hiver. 🧣</p>
${recette({infos:["⏱️ 5 min","🔥 10 min à la casserole","☕ 4 tasses","⭐ Facile"],
ing:["1 litre de lait entier","150 g de chocolat noir","1 cuillère à soupe de sucre (facultatif)","1 bâton de cannelle","1 pincée de muscade","Facultatif : 1 étoile de badiane, un zeste d'orange, de la chantilly"],
etapes:["Faire chauffer le lait avec la cannelle et les épices, sans bouillir, pendant 5 minutes.","Retirer le bâton de cannelle et le zeste.","Hors du feu, ajouter le chocolat haché et le sucre, fouetter jusqu'à ce qu'il fonde complètement.","Remettre 2 minutes à feu doux en fouettant fort pour faire mousser.","Servir bien chaud, avec une montagne de chantilly si on aime. ☁️"],
astuce:"Une petite pincée de sel fait ressortir le goût du chocolat."})}
${carte("🪵 D'où vient la bûche de Noël ?",`<p>Autrefois, le soir de Noël, on faisait brûler dans la cheminée une grosse bûche, choisie avec soin. Elle devait se consumer lentement, parfois plusieurs jours, et on gardait ses cendres pour porter bonheur.</p><p>Quand les grandes cheminées ont disparu des maisons, les pâtissiers ont imaginé à la fin du 19e siècle un gâteau en forme de bûche. La tradition continue, mais dans l'assiette ! 🍰</p>`)}`},
13:{c:"L",e:["📱","💛","✉️"],t:"Le message surprise",h:()=>`
${carte("💛 Le geste du jour",`<p>Envoyez un message gentil à quelqu'un qui ne s'y attend pas : un ami, un ancien collègue, un cousin éloigné, une maîtresse ou un professeur d'autrefois.</p><p>Un simple « Je pensais à toi, joyeux Noël ! » suffit. Et si on reçoit une réponse, on le raconte à la famille. 😊</p>`)}
${devinette("Pourquoi le Père Noël ne prend-il jamais l'ascenseur ?","Parce qu'il préfère passer par la cheminée ! 🏠🎅")}`},
14:{c:"P",e:["🌟","🎀","📸"],t:"La déco qui a une histoire",h:()=>`
${carte("📸 Le défi du jour",`<p>Chacun photographie une décoration qui compte pour lui et raconte son histoire à la famille : qui l'a offerte, depuis quand elle est accrochée, pourquoi on y tient.</p><p>Une boule fabriquée à l'école, une étoile héritée, un santon un peu cabossé… Ce sont souvent les plus belles histoires. ✨</p>`)}
${devinette("Quel est le fruit préféré des lutins ?","Le kiwi… parce que sa peau gratte comme un pull de Noël ! 🥝🧶")}`},
15:{c:"T",e:["🌲","🍎","✨"],t:"L'histoire du sapin",h:()=>`
${carte("🌲 Pourquoi décore-t-on un sapin ?",`<p>Depuis très longtemps, les arbres qui restent verts en hiver sont un symbole de vie et d'espoir, quand tout le reste semble endormi.</p><p>En France, l'une des plus anciennes traces écrites du sapin de Noël vient d'Alsace : en 1521, la ville de Sélestat note dans ses comptes des dépenses pour faire garder les forêts, afin qu'on n'y coupe pas trop d'arbres pour Noël. 🌲</p><p>On les décorait alors de pommes rouges, de petits gâteaux et de fleurs en papier. On raconte que les premières boules en verre sont nées en Moselle, une année où il n'y avait pas assez de pommes. 🍎➡️🔴</p>`)}
${devinette("Que dit le sapin quand on lui accroche toutes ses boules ?","« Je me sens tout chose… je suis complètement décoré ! » 🎄😄")}`},
16:{c:"T",e:["🌍","🎁","📚"],t:"Noël autour du monde",h:()=>`
${carte("🇯🇵 Au Japon",`<p>Noël n'y est pas une fête religieuse traditionnelle, mais beaucoup de familles y mangent… du poulet frit ! Une habitude née d'une campagne publicitaire dans les années 1970, si populaire qu'il faut parfois réserver son repas à l'avance. 🍗</p>`)}
${carte("🇲🇽 Au Mexique",`<p>Du 16 au 24 décembre, ce sont les posadas : chaque soir, on rejoue en chantant la recherche d'un abri par Marie et Joseph, de maison en maison. La fête se termine souvent par une piñata remplie de bonbons. 🪅</p>`)}
${carte("🇮🇸 En Islande",`<p>La veille de Noël, on s'offre des livres, puis on passe la soirée à lire au lit avec du chocolat. Cette tradition porte un joli nom, Jólabókaflóð, « l'inondation de livres de Noël ». 📚🍫</p>`)}
<p>Et vous, laquelle de ces traditions aimeriez-vous adopter cette année ? 😊</p>`},
17:{c:"N",e:["🧠","❓","🏆"],t:"Le grand quiz de Noël",h:()=>`
<p>Avez-vous bien lu les cases ? 6 questions sur tout ce qu'on a appris depuis le début du mois. Envoyez votre score à la famille ! 🏆</p>
${carte("",`<div id="quiz"></div><p class="score" id="quiz-score" hidden></p>`)}`},
18:{c:"E",e:["🎬","🍿","🛋️"],t:"Le même film, le même soir",h:()=>`
${carte("🎬 Le défi du jour",`<p>Choisissez ensemble un film de Noël, et ce soir, chacun le regarde chez soi, sous un plaid avec du pop-corn. Le lendemain, chacun donne sa note sur 10 à la famille. 🍿</p><p>Quelques idées pour tous les âges : Le Pôle Express, Klaus, Le Grinch, Maman, j'ai raté l'avion, Arthur Christmas.</p>`)}
${devinette("Quel est le sport préféré des bonshommes de neige ?","Le ski… mais ils n'aiment pas trop le soleil de l'après-midi ! ⛷️⛄")}`},
19:{c:"L",e:["📞","❤️","🕯️"],t:"Un appel qui réchauffe",h:()=>`
${carte("📞 Le geste du jour",`<p>Les fêtes peuvent être un moment difficile pour les personnes seules. Aujourd'hui, appelez quelqu'un qui pourrait se sentir un peu isolé : un voisin âgé, une vieille connaissance, un membre de la famille qu'on appelle trop rarement.</p><p>Quelques minutes de conversation, et c'est un peu de chaleur de Noël qui voyage. ❤️</p>`)}
${devinette("Pourquoi le Père Noël a-t-il toujours le sourire ?","Parce qu'il ne travaille qu'une nuit par an ! 😁🎅")}`},
20:{c:"R",e:["🥯","🧑‍🍳","👦"],t:"Les manneles",h:()=>`
<p>La grande recette du dimanche, au four cette fois : de petits bonshommes briochés à croquer. 🥰</p>
${recette({infos:["⏱️ 30 min","⏳ 1 h 30 de repos","🔥 20 min au four","👦 6 bonshommes","⭐⭐ Moyen"],
ing:["500 g de farine","20 g de levure de boulanger fraîche (ou 1 sachet de levure sèche)","25 cl de lait tiède","70 g de sucre","80 g de beurre mou","1 œuf, plus 1 jaune pour dorer","1 pincée de sel","Des pépites de chocolat pour les yeux et les boutons"],
etapes:["Délayer la levure dans le lait tiède et attendre 5 minutes.","Mélanger la farine, le sucre et le sel, puis ajouter le lait et l'œuf.","Pétrir 10 minutes, puis ajouter le beurre en morceaux jusqu'à obtenir une pâte souple.","Couvrir d'un torchon et laisser lever 1 heure dans un endroit tiède.","Diviser la pâte en 6. Former une petite boule pour la tête et un boudin pour le corps, puis couper les bras et les jambes avec des ciseaux.","Ajouter les pépites de chocolat et laisser lever encore 30 minutes.","Dorer au jaune d'œuf et cuire 20 minutes à 180 °C."],
astuce:"La pâte a assez levé quand elle a doublé de volume. Chacun peut donner une drôle de tête à son bonhomme ! 😄"})}
${carte("👦 Le petit bonhomme d'Alsace",`<p>En alsacien, mannele veut dire « petit bonhomme ». En Alsace et en Lorraine, on les déguste au début de décembre, souvent avec un bon chocolat chaud.</p>`)}`},
21:{c:"N",e:["🧩","⚖️","🎁"],t:"La grande énigme",h:()=>`
${carte("🧩 La plus difficile du mois",`<p>Un lutin a 9 cadeaux qui se ressemblent tous. L'un d'eux est un tout petit peu plus lourd que les autres. Il dispose d'une balance à deux plateaux.</p><p>Comment trouver le cadeau le plus lourd en seulement deux pesées ? ⚖️</p>${reveler("Voir la solution","On fait 3 tas de 3 cadeaux. Première pesée : un tas contre un autre. Si un côté penche, le cadeau lourd est dans ce tas ; sinon, il est dans le troisième. Deuxième pesée : dans ce tas, on pèse un cadeau contre un autre. Si un côté penche, c'est lui ; sinon, c'est le cadeau restant ! 🎉")}`)}
<p>Le premier qui trouve envoie sa solution à la famille. Pas le droit de regarder avant ! 🙈</p>`},
22:{c:"T",e:["🎵","🌙","⭐"],t:"Douce nuit",h:()=>`
${carte("🎵 L'histoire d'un chant",`<p>Le soir du 24 décembre 1818, dans le petit village d'Oberndorf, près de Salzbourg en Autriche, on chante pour la première fois « Douce nuit ». Les paroles sont du prêtre Joseph Mohr, la musique de l'instituteur Franz Xaver Gruber. 🎶</p><p>On raconte que l'orgue de l'église était en panne : le chant fut donc accompagné… à la guitare ! 🎸</p><p>Il a depuis été traduit dans des centaines de langues. Pendant la trêve de Noël de 1914, des soldats ennemis l'auraient même chanté ensemble d'une tranchée à l'autre. 🕊️</p>`)}
<p>Ce soir, pourquoi ne pas l'écouter tous ensemble, chacun chez soi ? 🌙</p>`},
23:{c:"R",e:["🍪","⭐","🎄"],t:"Sablés de Noël",h:()=>`
<p>Dernière recette, à préparer pour la table du réveillon ou à offrir ! ⭐</p>
${recette({infos:["⏱️ 25 min","❄️ 30 min au frais","🔥 12 min au four","🍪 30 sablés","⭐ Facile"],
ing:["250 g de farine","125 g de beurre mou","100 g de sucre","1 œuf","1 cuillère à café de cannelle","1 pincée de sel","Pour le glaçage : 100 g de sucre glace et 1 cuillère à soupe de jus de citron"],
etapes:["Mélanger le beurre mou et le sucre jusqu'à obtenir une crème.","Ajouter l'œuf, puis la farine, la cannelle et le sel.","Former une boule, l'envelopper et la laisser 30 minutes au réfrigérateur.","Étaler la pâte sur 5 mm d'épaisseur entre deux feuilles de papier cuisson.","Découper des étoiles, des sapins et des cœurs avec des emporte-pièces.","Cuire 10 à 12 minutes à 180 °C, jusqu'à ce que les bords soient à peine dorés.","Laisser refroidir, puis décorer avec le glaçage."],
astuce:"Avant la cuisson, faites un petit trou avec une paille : vous pourrez accrocher les sablés au sapin avec un ruban. 🎀"})}
${carte("🍪 Les bredele",`<p>En Alsace, on prépare pour Noël des dizaines de sortes de petits gâteaux secs, les bredele. Autrefois, on en accrochait même au sapin, à côté des pommes !</p>`)}`},
24:{c:"F",e:["🌟","🎁","❤️","🎄"],t:"Le message de la famille",h:()=>`
<p style="font-size:18px">Joyeux Noël ! 🎄✨ Le sapin est entièrement allumé.</p>
${carte("❤️ Le dernier défi",`<p>Ce soir, chacun écrit un petit mot à toute la famille : un souvenir de ce mois de décembre, un merci, un vœu pour l'année qui vient.</p><p>Et chaque foyer envoie sa photo du réveillon, pour que tout le monde soit réuni, même de loin. 📸</p>`)}
${carte("",`<p>Pendant 24 jours, vous avez cuisiné, ri, deviné, aidé, remercié et partagé, chacun chez soi mais tous ensemble.</p><p class="signature">Pierre, Fanny, Manou, Corentine, Célestin, Clara et Chloé,<br>merci et joyeux Noël ! 🎁❤️</p>`)}`}
};

const RANGS=[[24],[22,23],[19,20,21],[15,16,17,18],[10,11,12,13,14],[4,5,6,7,8,9],[1,2,3]];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const jourDe=d=>JOURS[new Date(2026,11,d).getDay()]+" "+(d===1?"1er":d)+" décembre";

const apercu=location.hash==="#apercu";
function aujourdhui(){
  const p=new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
  const v=t=>+p.find(x=>x.type===t).value;
  return {a:v("year"),m:v("month"),j:v("day")};
}
function ouvertes(){
  if(apercu)return 24;
  const t=aujourdhui();
  if(t.a>2026)return 24;
  if(t.a===2026&&t.m===12)return Math.min(t.j,24);
  return 0;
}

const ciel=document.getElementById("ciel");
let graine=7;const hasard=()=>(graine=(graine*9301+49297)%233280)/233280;
for(let i=0;i<38;i++){
  const s=document.createElement("span");s.className="et";const duree=12+hasard()*12;
  s.style.cssText=`left:${(hasard()*98).toFixed(1)}%;font-size:${(10+hasard()*10).toFixed(0)}px;animation-duration:${duree.toFixed(1)}s;animation-delay:-${(hasard()*duree).toFixed(1)}s`;
  s.innerHTML=`<span style="animation-delay:${(hasard()*2.6).toFixed(2)}s">★</span>`;
  ciel.appendChild(s);
}

const vueSapin=document.getElementById("vue-sapin"),vueCase=document.getElementById("vue-case");
const bulle=document.getElementById("bulle");
let minuteur,derniere=null;

function dessinerSapin(){
  const n=ouvertes();
  const t=aujourdhui();
  document.getElementById("badge-apercu").hidden=!apercu;
  const dateTxt=new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",weekday:"long",day:"numeric",month:"long"}).format(new Date());
  document.getElementById("date-du-jour").textContent=dateTxt.charAt(0).toUpperCase()+dateTxt.slice(1);
  const att=document.getElementById("attente");
  if(n===0){
    const debut=Date.UTC(2026,11,1),maint=Date.UTC(t.a,t.m-1,t.j);
    const reste=Math.round((debut-maint)/864e5);
    att.textContent=reste===1?"🎄 La première boule s'allume demain !":`🎄 Plus que ${reste} jours avant la première boule`;
    att.hidden=false;
  } else if(n<24){att.textContent=`🎄 Encore ${24-n} ${24-n>1?"boules":"boule"} avant Noël`;att.hidden=false}
  else {att.textContent="🎁 Joyeux Noël !";att.hidden=false}
  const sapin=document.getElementById("sapin");sapin.innerHTML="";
  RANGS.forEach(r=>{
    const rang=document.createElement("div");rang.className="rang";
    r.forEach(d=>{
      const cat=CAT[C[d].c],ouverte=d<=n;
      const b=document.createElement("button");
      b.className="boule"+(ouverte?"":" future");
      b.style.background=ouverte?cat.vif:cat.pale;
      b.setAttribute("aria-label",`Case ${d}, ${ouverte?cat.nom+" : "+C[d].t:"pas encore ouverte"}`);
      b.innerHTML=d===24?'<span class="ti-etoile" aria-hidden="true">★</span>':d;
      b.addEventListener("click",()=>{
        b.classList.remove("rebond");void b.offsetWidth;b.classList.add("rebond");
        if(ouverte){bulle.hidden=true;setTimeout(()=>ouvrir(d),220)}
        else{bulle.textContent=`⏳ Patience ! Rendez-vous le ${jourDe(d)}`;bulle.hidden=false;clearTimeout(minuteur);minuteur=setTimeout(()=>bulle.hidden=true,2800)}
      });
      rang.appendChild(b);
    });
    sapin.appendChild(rang);
  });
  const tronc=document.createElement("div");tronc.className="tronc";sapin.appendChild(tronc);
  const leg=document.getElementById("legende");leg.innerHTML="";
  ["L","R","T","N","P","E","B"].forEach(k=>{leg.innerHTML+=`<span class="puce" style="--c:${CAT[k].vif}"><span style="color:${CAT[k].vif};display:inline-flex">${SYMB[k]}</span>${CAT[k].nom}</span>`});
}

function ouvrir(d){
  const c=C[d],cat=CAT[c.c];derniere=d;
  const ph=document.getElementById("c-photo"),im=document.getElementById("c-img");
  if(PHOTOS[d]){im.src=PHOTOS[d][0];im.alt=PHOTOS[d][1];ph.hidden=false;ph.style.animation="none";void ph.offsetWidth;ph.style.animation=""}else{ph.hidden=true;im.removeAttribute("src")}
  document.getElementById("c-emojis").innerHTML=c.e.map(x=>`<span>${x}</span>`).join("");
  const et=document.getElementById("c-etiquette");
  et.textContent=cat.nom;et.style.background=cat.fond;et.style.color=cat.fonce;
  document.getElementById("c-titre").textContent=c.t;
  document.getElementById("c-jour").textContent="Case "+d+" · "+jourDe(d);
  const contenu=document.getElementById("c-contenu");contenu.innerHTML=c.h();
  contenu.querySelectorAll("[data-reveler]").forEach(btn=>btn.addEventListener("click",()=>{btn.nextElementSibling.hidden=false;btn.hidden=true}));
  if(d===17)monterQuiz();
  vueSapin.hidden=true;vueCase.hidden=false;
  vueCase.style.animation="none";void vueCase.offsetWidth;vueCase.style.animation="";
  window.scrollTo(0,0);
  document.getElementById("retour").focus({preventScroll:true});
}
function fermer(){
  vueCase.hidden=true;vueSapin.hidden=false;window.scrollTo(0,0);
  if(derniere){const b=[...document.querySelectorAll(".boule")].find(x=>x.getAttribute("aria-label").startsWith("Case "+derniere+","));if(b)b.focus({preventScroll:true})}
}
document.getElementById("retour").addEventListener("click",fermer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!vueCase.hidden)fermer()});

function monterQuiz(){
  const zone=document.getElementById("quiz"),score=document.getElementById("quiz-score");
  let bonnes=0,repondues=0;
  QUIZ.forEach(([q,choix,ok],i)=>{
    const bloc=document.createElement("div");bloc.className="quiz-q";
    bloc.innerHTML=`<p><b>${i+1}.</b> ${q}</p><div class="choix"></div>`;
    const ch=bloc.querySelector(".choix");
    choix.forEach((txt,j)=>{
      const b=document.createElement("button");b.textContent=txt;
      b.addEventListener("click",()=>{
        ch.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k===ok)x.classList.add("bon")});
        if(j===ok){bonnes++;b.textContent="✅ "+txt}else{b.classList.add("faux");b.textContent="❌ "+txt}
        repondues++;
        if(repondues===QUIZ.length){
          score.hidden=false;
          score.textContent=bonnes===QUIZ.length?`🏆 ${bonnes} sur ${QUIZ.length}, sans faute, bravo !`:bonnes>=4?`🌟 ${bonnes} sur ${QUIZ.length}, très bien !`:`🎄 ${bonnes} sur ${QUIZ.length}, il est temps de relire les cases !`;
        }
      });
      ch.appendChild(b);
    });
    zone.appendChild(bloc);
  });
}
